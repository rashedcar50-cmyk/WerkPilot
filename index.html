<style>
:root{--bg:#0b1220;--panel:#151f33;--panel2:#1d2940;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--pri:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#b91c1c;--font:16px}
*{box-sizing:border-box}
html{font-size:var(--font)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:22px}
.login-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px #0007}
.brand{font-size:2rem;font-weight:800}.tag{color:var(--muted);margin:6px 0 24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0f172a;color:var(--text)}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 15px;background:#334155;color:white;font-weight:700}
.btn.primary{background:var(--pri)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 10px;font-size:.9rem}.full{width:100%}
.hint,.muted{color:var(--muted);font-size:.92rem}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#0f172a;border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebrand{font-size:1.35rem;font-weight:800;margin-bottom:14px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{background:transparent;color:var(--text);border:0;border-radius:10px;padding:10px 12px;text-align:right}
.nav button.active,.nav button:hover{background:var(--panel2)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:8;background:#0f172aee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:18px;max-width:1400px;margin:auto}
.page-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{margin:0;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.metric{font-size:1.8rem;font-weight:800;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#1e293b;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px;background:var(--panel)}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#111827;position:sticky;top:0}
.status{padding:4px 8px;border-radius:999px;background:#334155}.status.ok{background:#14532d}.status.warn{background:#78350f}
.modal-back{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}
.filebox{border:1px dashed #64748b;border-radius:12px;padding:12px;background:#0f172a}
.ocr-preview{max-width:100%;max-height:220px;border-radius:10px;margin-top:10px}
.progress{height:8px;background:#334155;border-radius:999px;overflow:hidden;margin:8px 0}.progress>div{height:100%;width:0;background:#3b82f6}
.kpi-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mobile-menu{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;top:0;z-index:30;width:260px;transition:.2s}.sidebar.open{right:0}
  .mobile-menu{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.hide-mobile{display:none}}

@media print{
  .sidebar,.topbar,.toolbar,.btn,.nav,.mobile-menu,#modalRoot,.toast{display:none!important}
  .shell{display:block}
  .main,.content{padding:0;max-width:100%}
  body{background:#fff;color:#000}
  .card,table{border-color:#ccc}
  th{background:#eee!important;color:#000}
}
.print-doc{direction:rtl;font-family:Arial,sans-serif;padding:24px;color:#111}
.print-doc h1{margin:0 0 8px;font-size:22px}
.print-doc .meta{color:#555;margin-bottom:16px;font-size:13px}
.print-doc table{width:100%;border-collapse:collapse;margin-top:12px}
.print-doc th,.print-doc td{border:1px solid #ccc;padding:8px;text-align:right;font-size:13px}
.print-doc th{background:#f3f4f6}
.share-bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}

</style>

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(storeKey)||'{}');
  const base=clone(seed);
  const merged={...base,...raw};
  // إذا المجموعات فاضية استخدم بيانات التجربة من seed
  ['customers','vehicles','repairs','invoices','purchases','inventory','employees','expenses'].forEach(k=>{
   if(!Array.isArray(merged[k]) || merged[k].length===0) merged[k]=clone(seed[k]||[]);
  });
  if(!merged.settings) merged.settings=clone(seed.settings);
  if(!Array.isArray(merged.users) || !merged.users.length) merged.users=clone(seed.users);
  if(!Array.isArray(merged.companies) || !merged.companies.length) merged.companies=clone(seed.companies);
  return merged;
 }catch{return clone(seed)}
}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}

/* ===== Supabase data layer (purchases أولاً) ===== */
async function sbReady(){
  return !!(window.supabaseClient);
}

async function loadPurchasesFromCloud(){
  try{
    const sb = window.supabaseClient;
    if(!sb) return false;
    const { data, error } = await sb.from('purchases').select('*').order('purchase_date', { ascending: false });
    if(error){ console.warn('loadPurchases', error.message); return false; }
    if(!Array.isArray(data)) return false;
    db.purchases = data.map(r => ({
      id: 'p_cloud_' + r.id,
      cloudId: r.id,
      companyId: r.company_id || 'de',
      supplier: r.supplier || '',
      invoice_number: r.invoice_number || '',
      item: r.item || '',
      qty: r.qty,
      price: r.price,
      subtotal: r.subtotal,
      tax_amount: r.tax_amount,
      total_amount: r.total_amount,
      date: r.purchase_date || r.date || '',
      payment_status: r.payment_status || r.status || 'pending',
      notes: r.notes || '',
      receipt_url: r.receipt_url || ''
    }));
    save();
    return true;
  }catch(e){ console.warn(e); return false; }
}

async function upsertPurchaseCloud(p){
  try{
    const sb = window.supabaseClient;
    if(!sb) return;
    const row = {
      // company_id في قاعدة البيانات bigint FK — نتركه null مؤقتاً لتجنب خطأ المفتاح الأجنبي
      supplier: p.supplier || '',
      invoice_number: p.invoice_number || '',
      item: p.item || '',
      qty: Number(p.qty ?? 1),
      price: Number(p.price ?? 0),
      subtotal: Number(p.subtotal ?? 0),
      tax_amount: Number(p.tax_amount ?? 0),
      total_amount: Number(p.total_amount ?? 0),
      purchase_date: p.date || new Date().toISOString().slice(0,10),
      payment_status: p.payment_status || 'pending',
      notes: p.notes || '',
      receipt_url: p.receipt_url || ''
    };
    // إذا id رقمي من السحابة نحدّث، وإلا ندرج صف جديد
    let error;
    if(p.cloudId){
      ({ error } = await sb.from('purchases').update(row).eq('id', p.cloudId));
    } else {
      const res = await sb.from('purchases').insert(row).select('id').single();
      error = res.error;
      if(res.data?.id){
        p.cloudId = res.data.id;
        // حدّث النسخة المحلية بالـ cloudId
        const local = db.purchases.find(x => x.id === p.id);
        if(local) local.cloudId = res.data.id;
        save();
      }
    }
    if(error) console.warn('upsertPurchase', error.message);
  }catch(e){ console.warn(e); }
}

async function deletePurchaseCloud(pid){
  try{
    const sb = window.supabaseClient;
    if(!sb) return;
    const local = db.purchases.find(x => x.id === pid);
    const cloudId = local?.cloudId;
    if(!cloudId) return;
    const { error } = await sb.from('purchases').delete().eq('id', cloudId);
    if(error) console.warn('deletePurchase', error.message);
  }catch(e){ console.warn(e); }
}

async function loadCustomersFromCloud(){
  try{
    const sb=window.supabaseClient; if(!sb) return false;
    const {data,error}=await sb.from('customers').select('*');
    if(error||!Array.isArray(data)||!data.length) return false;
    const mapped=data.map(r=>({
      id:'c_cloud_'+r.id, cloudId:r.id, companyId:r.company_id||'de',
      name:r.name||'', phone:r.phone||'', email:r.email||'', address:r.address||''
    })).filter(x=>x.name);
    if(mapped.length){ db.customers=mapped; save(); return true; }
  }catch(e){console.warn(e)}
  return false;
}
async function upsertCustomerCloud(c){
  try{
    const sb=window.supabaseClient; if(!sb) return;
    const row={name:c.name||'',phone:c.phone||'',email:c.email||'',address:c.address||''};
    if(c.cloudId){ await sb.from('customers').update(row).eq('id',c.cloudId); }
    else {
      const {data,error}=await sb.from('customers').insert(row).select('id').single();
      if(!error && data?.id){ c.cloudId=data.id; save(); }
    }
  }catch(e){console.warn(e)}
}
async function loadInventoryFromCloud(){
  try{
    const sb=window.supabaseClient; if(!sb) return false;
    const {data,error}=await sb.from('inventory').select('*');
    if(error||!Array.isArray(data)||!data.length) return false;
    const mapped=data.map(r=>({
      id:'inv_cloud_'+r.id, cloudId:r.id, companyId:r.company_id||'de',
      sku:r.sku||'', name:r.name||'', qty:Number(r.qty||0), buy:Number(r.buy||0), sell:Number(r.sell||0)
    })).filter(x=>x.name||x.sku);
    if(mapped.length){ db.inventory=mapped; save(); return true; }
  }catch(e){console.warn(e)}
  return false;
}
async function upsertInventoryCloud(item){
  try{
    const sb=window.supabaseClient; if(!sb) return;
    const row={sku:item.sku||'',name:item.name||'',qty:Number(item.qty||0),buy:Number(item.buy||0),sell:Number(item.sell||0)};
    if(item.cloudId){ await sb.from('inventory').update(row).eq('id',item.cloudId); }
    else {
      const {data,error}=await sb.from('inventory').insert(row).select('id').single();
      if(!error && data?.id){ item.cloudId=data.id; save(); }
    }
  }catch(e){console.warn(e)}
}



function id(p='x'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(v){return Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2200)}
function audit(action,detail=''){db.audit.unshift({id:id('a'),ts:new Date().toISOString(),user:session?.user?.name||'system',company:session?.company?.id||'',action,detail});save()}
function companyRows(name){return db[name].filter(x=>x.companyId===session.company.id)}
function customerName(cid){return db.customers.find(c=>c.id===cid)?.name||'-'}
function vehicleName(vid){const v=db.vehicles.find(x=>x.id===vid);return v?`${v.plate||v.vin||'-'} · ${v.make||''} ${v.model||''}`:'-'}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function roleCan(section){
 const r=session.user.role;
 if(r==='manager') return true;
 if(r==='accountant') return !['settings'].includes(section);
 if(r==='mechanic') return ['dashboard','customers','vehicles','repairs','estimates','integrations'].includes(section);
 if(r==='warehouse') return ['dashboard','inventory','purchases','integrations'].includes(section);
 return false;
}

const nav=[
 ['dashboard','الرئيسية'],['customers','العملاء'],['vehicles','السيارات'],['repairs','أوامر الإصلاح'],
 ['estimates','Kostenvoranschlag'],['invoices','الفواتير و Barverkauf'],['purchases','المشتريات'],
 ['inventory','المخزون وقطع الغيار'],['employees','الموظفون والرواتب'],['expenses','المصاريف'],
 ['journal','دفتر اليومية'],['reports','التقارير'],['integrations','التكاملات'],
 ['audit','سجل النشاط'],['settings','الإعدادات']
];

function login(){
 document.documentElement.dir='rtl';
 $('#app').innerHTML=`<div class="login-screen"><div class="login-card">
 <div class="brand">WerkPilot Pro</div><div class="tag">إدارة الورشة الذكية</div>
 <div class="field"><label>اسم المستخدم</label><input id="lu" value="admin"></div>
 <div class="field"><label>كلمة المرور</label><input id="lp" type="password" value="1234"></div>
 <button class="btn primary full" id="loginBtn">دخول</button>
 <div class="hint" style="margin-top:12px">admin / 1234 · accountant / 1234 · mechanic / 1234 · warehouse / 1234</div>
 </div></div>`;
 $('#loginBtn').onclick=()=>{
  const u=db.users.find(x=>x.u===$('#lu').value&&x.p===$('#lp').value);
  if(!u)return toast('بيانات الدخول غير صحيحة');
  session={user:u,company:db.companies[0],page:'dashboard'};
  audit('login');
  Promise.all([
    loadPurchasesFromCloud(),
    loadCustomersFromCloud(),
    loadInventoryFromCloud()
  ]).finally(()=>render());
 };
}

function render(){
 document.documentElement.style.setProperty('--font',db.settings.font+'px');
 const allowed=nav.filter(([k])=>roleCan(k));
 $('#app').innerHTML=`<div class="shell">
 <aside class="sidebar" id="side"><div class="sidebrand">WerkPilot Pro</div><div class="nav">
 ${allowed.map(([k,l])=>`<button data-page="${k}" class="${session.page===k?'active':''}">${l}</button>`).join('')}
 </div></aside>
 <main class="main">
  <div class="topbar">
   <div class="top-actions"><button class="btn ghost mobile-menu" id="menu">☰</button>
   <select id="company">${db.companies.map(c=>`<option value="${c.id}" ${c.id===session.company.id?'selected':''}>${c.name} · ${c.country}</option>`).join('')}</select></div>
   <div class="top-actions"><span class="badge hide-mobile"><span class="dot"></span>${session.user.name}</span><button class="btn ghost small" id="logout">خروج</button></div>
  </div>
  <div class="content" id="content"></div>
 </main></div>`;
 $$('[data-page]').forEach(b=>b.onclick=()=>{session.page=b.dataset.page;render()});
 $('#logout').onclick=()=>{audit('logout');session=null;login()};
 $('#company').onchange=e=>{session.company=db.companies.find(c=>c.id===e.target.value);session.page='dashboard';render()};
 $('#menu').onclick=()=>$('#side').classList.toggle('open');
 page();
}
function page(){
 const m={dashboard,customers,vehicles,repairs,estimates,invoices,purchases,inventory,employees,expenses,journal,reports,integrations,audit:auditPage,settings};
 (m[session.page]||dashboard)();
}
function head(title,action=''){return `<div class="page-title"><h1>${title}</h1>${action}</div>`}

const PAGE_SIZE = 50;
function table(headers, rows, pageKey){
  if(!rows.length) return `<div class="card muted">لا توجد بيانات بعد.</div>`;
  const key = pageKey || 'default';
  if(!window._tblPage) window._tblPage = {};
  if(window._tblPage[key] == null) window._tblPage[key] = 0;
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(window._tblPage[key] >= pages) window._tblPage[key] = pages - 1;
  const page = window._tblPage[key];
  const slice = rows.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
  const pager = pages > 1 ? `<div class="toolbar" style="margin-top:10px;justify-content:space-between">
    <span class="muted">عرض ${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,total)} من ${total}</span>
    <div class="toolbar">
      <button class="btn small ghost" ${page<=0?'disabled':''} onclick="window._tblPage['${key}']=${page-1};render()">السابق</button>
      <span class="muted">${page+1} / ${pages}</span>
      <button class="btn small ghost" ${page>=pages-1?'disabled':''} onclick="window._tblPage['${key}']=${page+1};render()">التالي</button>
    </div>
  </div>` : `<div class="muted" style="margin-top:8px">${total} سجل</div>`;

      `</tbody></table>`;
  } else if(type === 'purchases'){
    title = id ? 'فاتورة شراء' : 'قائمة المشتريات';
    let rows = companyRows('purchases');
    if(id) rows = rows.filter(x => x.id === id);
    body = `<table><thead><tr><th>المورد</th><th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>` +
      rows.map(x=>{
        const total = Number(x.total_amount || (x.qty||0)*(x.price||0) || 0);
        return `<tr><td>${esc(x.supplier||'')}</td><td>${esc(x.invoice_number||x.item||'')}</td><td>${esc(x.date||'')}</td><td>${money(total)}</td><td>${esc(x.payment_status||'')}</td></tr>`;
      }).join('') + `</tbody></table>`;
  } else if(type === 'invoices'){
    title = id ? 'فاتورة' : 'قائمة الفواتير';
    let rows = companyRows('invoices');
    if(id) rows = rows.filter(x => x.id === id);
    body = `<table><thead><tr><th>النوع</th><th>السيارة</th><th>الصافي</th><th>الضريبة</th><th>الإجمالي</th><th>الدفع</th></tr></thead><tbody>` +

      `</tbody></table>`;
  } else if(type === 'inventory'){
    title = 'قائمة المخزون';
    const rows = companyRows('inventory');

  return `<div class="print-doc"><h1>${title}</h1><div class="meta">${esc(co)} · ${now}</div>${body}</div>`;

function plainTextDoc(type, id){
  const div = document.createElement('div');
  div.innerHTML = buildDocHTML(type, id);
  return (div.innerText || div.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}

function exportPrint(type, id){
  const html = buildDocHTML(type, id);
  const w = window.open('', '_blank', 'width=900,height=700');
  if(!w) return toast('اسمح بالنوافذ المنبثقة');
  w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طباعة</title>
    <style>body{font-family:Arial,sans-serif;padding:20px} table{width:100%;border-collapse:collapse} th,td{border:1px solid #ccc;padding:8px;text-align:right} th{background:#f3f4f6} h1{margin:0 0 8px}.meta{color:#555;margin-bottom:16px}</style>
    </head><body>${html}<script>window.onload=()=>{window.print()}<\/script></body></html>`);
  w.document.close();
}

function exportPDF(type, id){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const text = plainTextDoc(type, id);
    const lines = doc.splitTextToSize(text, 180);
    let y = 15;
    doc.setFontSize(11);
    lines.forEach(line => {
      if(y > 280){ doc.addPage(); y = 15; }
      doc.text(line, 15, y);
      y += 6;
    });
    const name = `${type || 'report'}-${(id||'list').slice(0,12)}-${Date.now().toString(36)}.pdf`;
    doc.save(name);
    toast('تم إنشاء PDF');
  }catch(e){
    console.error(e);
    toast('تعذر إنشاء PDF');
  }
}

function exportEmail(type, id){
  const subject = encodeURIComponent('WerkPilot - ' + (type || 'تقرير'));
  const body = encodeURIComponent(plainTextDoc(type, id).slice(0, 1800));
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

function exportWhatsApp(type, id){
  const text = encodeURIComponent(plainTextDoc(type, id).slice(0, 1500));
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

window.exportPrint = exportPrint;
window.exportPDF = exportPDF;
window.exportEmail = exportEmail;
window.exportWhatsApp = exportWhatsApp;

function parseVehicleOCR(text){
const t = text
.replace(/\r/g,' ')
.replace(/[ \t]+/g,' ')
.replace(/\n+/g,'\n');

const upper = t.toUpperCase();

const vinMatch = upper.match(/\b[A-HJ-NPR-Z0-9]{17}\b/);

const plateMatch = upper.match(/\b[A-ZÄÖÜ]{1,3}[-\s][A-Z]{1,2}[-\s]?\d{1,4}[EH]?\b/);

const yearMatch =
t.match(/\b(19|20)\d{2}\b/) ||
t.match(/\b\d{2}\.\d{2}\.(19|20)\d{2}\b/);

const makes = [
'VOLKSWAGEN','VW','BMW','MERCEDES','AUDI','OPEL','FORD',
'TOYOTA','RENAULT','PEUGEOT','CITROEN','SKODA','SEAT',
'FIAT','HYUNDAI','KIA','PORSCHE','MAZDA','NISSAN',
'HONDA','VOLVO','DACIA','TESLA','MINI'
];

const make = makes.find(x => upper.includes(x)) || '';

const modelPatterns = [
/D\.3[:\s]+([A-Z0-9\- ]+)/i,
/HANDELSBEZEICHNUNG[:\s]+([A-Z0-9\- ]+)/i
];

let model = '';
for(const p of modelPatterns){
const m = t.match(p);
if(m){
model = m[1].trim();
break;
}
}

let firstRegistration = '';
const regMatch =
t.match(/B[:\s]+(\d{2}\.\d{2}\.\d{4})/i) ||
t.match(/\b(\d{2}\.\d{2}\.\d{4})\b/);

if(regMatch) firstRegistration = regMatch[1];

return {
vin: vinMatch?.[0] || '',
year: yearMatch?.[0]?.slice(-4) || '',
plate: plateMatch?.[0]?.replace(/\s+/g,'-') || '',
make,
model,
firstRegistration
};
}

function applyPurchaseToInventory(p){
  const name = (p.item || p.notes || '').trim();
  const qty = Number(p.qty || 0);
  const price = Number(p.price || 0);
  if(!name || qty <= 0) return;
  let inv = db.inventory.find(x => x.companyId === (p.companyId||session?.company?.id) && (x.name === name || x.sku === name));
  if(inv){
    inv.qty = Number(inv.qty||0) + qty;
    if(price > 0) inv.buy = price;
    save();
    upsertInventoryCloud(inv);
  } else {
    const item = {
      id: id('inv'),
      companyId: p.companyId || session?.company?.id || 'de',
      sku: (p.invoice_number || 'AUTO') + '-' + Date.now().toString(36).slice(-4),
      name,
      qty,
      buy: price,
      sell: price ? Math.round(price * 1.6 * 100) / 100 : 0
    };
    db.inventory.push(item);
    save();
    upsertInventoryCloud(item);
  }
}

/** تصغير وضغط الصورة قبل OCR — أسرع وأقل حجماً */
function compressImageForOCR(file, maxSide=1280, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith('image/')){
      // PDF أو غير صورة: أرجعه كما هو
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        let { width, height } = img;
        const scale = Math.min(1, maxSide / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        // JPEG دائماً للـ OCR
        resolve(canvas.toDataURL('image/jpeg', quality));
      }catch(e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

async function scanPurchaseDocument(){
  // حالة مؤقتة للفترة بين الرفع والحفظ
  let pendingFile = null;
  let pendingPreviewUrl = null;
  let pendingAi = {};
  let pendingReceiptUrl = '';

  modal('تصوير / رفع فاتورة شراء', `

        <button type="button" class="btn ghost" id="btnPreview" disabled>👁️ عرض الفاتورة</button>
      </div>
      <img id="purchaseImg" class="ocr-preview hidden" style="margin-top:12px;max-height:280px;cursor:pointer" title="اضغط للعرض الكامل">
      <div id="purchaseStatus" class="hint" style="margin-top:8px">اختر صورة أولاً ثم اضغط «قراءة البيانات»</div>
    </div>

    <div id="purchaseFormBox" class="hidden" style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <div class="muted" style="margin-bottom:10px">2) راجع البيانات قبل الحفظ</div>
      <div class="form-grid">
        <div class="field"><label>المورد</label><input id="p_supplier" placeholder="اسم المورد"></div>
        <div class="field"><label>رقم الفاتورة</label><input id="p_inv"></div>
        <div class="field"><label>التاريخ</label><input id="p_date" type="date"></div>
        <div class="field"><label>الإجمالي €</label><input id="p_total" type="number" step="0.01" value="0"></div>
        <div class="field"><label>الصافي €</label><input id="p_sub" type="number" step="0.01" value="0"></div>
        <div class="field"><label>الضريبة €</label><input id="p_tax" type="number" step="0.01" value="0"></div>
        <div class="field"><label>الحالة</label>
          <select id="p_status">
            <option value="pending">معلق</option>
            <option value="paid">مدفوع</option>
          </select>
        </div>
        <div class="field span2"><label>ملاحظات / الأصناف</label><textarea id="p_notes" rows="2"></textarea></div>
      </div>
    </div>
  `, async ()=>{
    // الحفظ النهائي فقط
    const supplier = ($('#p_supplier')?.value || '').trim();
    const total = Number($('#p_total')?.value) || 0;
    if(!pendingFile && !pendingReceiptUrl) return toast('ارفع فاتورة أولاً');
    if(!supplier) return toast('أدخل اسم المورد');
    if(total <= 0) return toast('أدخل المبلغ الإجمالي');

    try{
      $('#msave').disabled = true;
      $('#purchaseStatus').textContent = 'جاري الحفظ...';

      // ارفع الملف الآن فقط عند التأكيد (أسرع في مرحلة القراءة)
      let receiptUrl = pendingReceiptUrl;
      if(!receiptUrl && pendingFile){
        const sb = window.supabaseClient;
        if(!sb) throw new Error('Supabase غير مهيأ');
        const fileName = `${Date.now()}-${(pendingFile.name||'receipt.jpg').replace(/[^a-zA-Z0-9._-]/g,'_')}`;
        const { error: uploadError } = await sb.storage
          .from('purchase-receipts')
          .upload(fileName, pendingFile, { contentType: pendingFile.type || 'image/jpeg', upsert: false });
        if(uploadError) throw uploadError;
        const { data: urlData } = sb.storage.from('purchase-receipts').getPublicUrl(fileName);
        receiptUrl = urlData.publicUrl;
      }

      const purchase = {
        id: id('p'),
        companyId: session.company.id,
        supplier,
        invoice_number: ($('#p_inv')?.value || '').trim(),
        receipt_url: receiptUrl || '',
        date: $('#p_date')?.value || new Date().toISOString().slice(0,10),
        subtotal: Number($('#p_sub')?.value) || 0,
        tax_amount: Number($('#p_tax')?.value) || 0,
        total_amount: total,
        payment_status: $('#p_status')?.value || 'pending',
        notes: ($('#p_notes')?.value || '').trim()
      };

      db.purchases.push(purchase);
      applyPurchaseToInventory(purchase);

      upsertPurchaseCloud(purchase);

      toast(e.message || 'فشل الحفظ');
      $('#msave').disabled = false;
    }
  }, 'حفظ الفاتورة');

  // تعطيل زر الحفظ في البداية
  setTimeout(()=>{
    const saveBtn = $('#msave');
    if(saveBtn) saveBtn.disabled = true;

    const fileInput = $('#purchaseFile');
    const btnRead = $('#btnRead');
    const btnPreview = $('#btnPreview');
    const btnCam = $('#btnOpenCam');
    const img = $('#purchaseImg');
    const status = $('#purchaseStatus');
    const formBox = $('#purchaseFormBox');

    function setPreviewFromFile(f){
      pendingFile = f;
      if(pendingPreviewUrl) URL.revokeObjectURL(pendingPreviewUrl);
      pendingPreviewUrl = null;
      pendingAi = {};
      pendingReceiptUrl = '';
      formBox.classList.add('hidden');
      if(saveBtn) saveBtn.disabled = true;

      if(f.type.startsWith('image/')){
        pendingPreviewUrl = URL.createObjectURL(f);
        img.src = pendingPreviewUrl;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }
      btnRead.disabled = false;
      btnPreview.disabled = false;
      status.textContent = 'جاهز — اضغط «قراءة البيانات» أو «عرض الفاتورة»';
    }

    fileInput.onchange = ()=>{
      const f = fileInput.files[0];
      if(f) setPreviewFromFile(f);
    };

    // عرض كامل قبل الحفظ
    function openFullPreview(){
      if(pendingPreviewUrl){
        window.open(pendingPreviewUrl, '_blank');
        return;
      }
      if(pendingFile){
        const url = URL.createObjectURL(pendingFile);
        window.open(url, '_blank');
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
        return;
      }
      toast('لا توجد صورة للعرض');
    }
    btnPreview.onclick = openFullPreview;
    img.onclick = openFullPreview;

    btnCam.onclick = ()=> openCameraForPurchase((file)=>{
      // وضع الملف في الـ input
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      setPreviewFromFile(file);
    });

    // قراءة سريعة: OCR فقط بدون رفع
    btnRead.onclick = async ()=>{
      const f = pendingFile || fileInput.files[0];
      if(!f) return toast('اختر صورة أولاً');

      btnRead.disabled = true;
      status.textContent = '⚡ جاري قراءة البيانات...';
      const t0 = performance.now();

      try{
        // تصغير وضغط الصورة أولاً → أسرع في الإرسال والقراءة
        status.textContent = '⚡ جاري تجهيز الصورة...';
        const imageData = await compressImageForOCR(f, 1280, 0.72);
        const approxKB = Math.round((imageData.length * 0.75) / 1024);
        status.textContent = `⚡ جاري قراءة البيانات (~${approxKB}KB)...`;

        let ai = {};
        try{
          const controller = new AbortController();
          const timeout = setTimeout(()=> controller.abort(), 15000); // أقصى 15 ثانية

          const response = await fetch(`${window.SUPABASE_URL}/functions/v1/purchase-ocr`, {
            method: 'POST',
            signal: controller.signal,
            headers: {
              'Content-Type': 'application/json',
              'apikey': window.SUPABASE_KEY,
              'Authorization': `Bearer ${window.SUPABASE_KEY}`
            },
            body: JSON.stringify({ image: imageData })
          });
          clearTimeout(timeout);

          if(response.ok){
            ai = await response.json();
          } else {
            console.warn('OCR failed', await response.text());
          }
        } catch(ocrErr){
          console.warn('OCR error/timeout', ocrErr);
        }

        pendingAi = ai || {};
        const parseNum = (v) => Number(String(v||'0').replace(',','.').replace(/[^\d.-]/g,'')) || 0;

        // املأ النموذج فوراً
        $('#p_supplier').value = ai.supplier_name || ai.supplier || '';
        $('#p_inv').value = ai.invoice_number || '';
        $('#p_date').value = (ai.purchase_date || ai.date || new Date().toISOString().slice(0,10)).toString().slice(0,10);
        $('#p_sub').value = parseNum(ai.subtotal);
        $('#p_tax').value = parseNum(ai.tax_amount);
        const total = parseNum(ai.total_amount) || (parseNum(ai.subtotal) + parseNum(ai.tax_amount));
        $('#p_total').value = total;
        $('#p_notes').value = ai.notes || ai.item || '';
        if(ai.payment_status) $('#p_status').value = ai.payment_status;

        formBox.classList.remove('hidden');
        if(saveBtn) saveBtn.disabled = false;

        const ms = Math.round(performance.now() - t0);
        const hasData = !!(ai.supplier_name || ai.supplier || ai.invoice_number || total);
        status.textContent = hasData
          ? `✓ تمت القراءة خلال ${ms}ms — راجع البيانات ثم احفظ`
          : `⚠ لم تُستخرج بيانات كافية (${ms}ms) — أكمل يدوياً ثم احفظ`;

      } catch(e){
        console.error(e);
        status.textContent = 'خطأ في القراءة: ' + (e.message||'');
        // افتح النموذج يدوياً حتى لو فشل OCR
        formBox.classList.remove('hidden');
        if(saveBtn) saveBtn.disabled = false;
        $('#p_date').value = new Date().toISOString().slice(0,10);
      } finally {
        btnRead.disabled = false;
      }
    };
  }, 30);
}

async function openCameraForPurchase(onCapture){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return toast('الكاميرا غير مدعومة في هذا المتصفح');
  }

  const box = document.createElement('div');
  box.className = 'modal-back';
  box.innerHTML = `
    <div class="modal" style="max-width:700px">
      <div class="modal-head">
        <b>📷 تصوير فاتورة الشراء</b>
        <button id="camClose" class="btn bad">✕</button>
      </div>
      <video id="cameraVideo" autoplay playsinline style="width:100%;border-radius:12px;background:#000;max-height:60vh"></video>
      <div style="margin-top:12px;text-align:center;display:flex;gap:8px;justify-content:center">
        <button id="takePhoto" class="btn primary">📸 التقاط</button>
        <button id="camClose2" class="btn ghost">إلغاء</button>
      </div>
    </div>
  `;
  document.body.appendChild(box);

  const video = box.querySelector('#cameraVideo');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = stream;

    const close = ()=>{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      box.remove();
    };
    box.querySelector('#camClose').onclick = close;
    box.querySelector('#camClose2').onclick = close;

    box.querySelector('#takePhoto').onclick = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(blob=>{
        if(!blob){ toast('فشل التقاط الصورة'); return; }
        const file = new File([blob], 'purchase-receipt.jpg', { type: 'image/jpeg' });
        close();
        if(typeof onCapture === 'function') onCapture(file);
        else toast('تم التقاط الصورة');
      }, 'image/jpeg', 0.85); // جودة 0.85 = أسرع وأصغر
    };
  } catch(e){
    box.remove();
    toast('لم يتم السماح باستخدام الكاميرا');
    console.error(e);
  }
}

modal('تصوير فاتورة مصروف',`
<div class="field">
<label>صوّر الفاتورة أو اختر صورة</label>
<input id="doc" type="file" accept="image/*">
<button type="button" class="btn primary" onclick="openCamera()">📷 فتح الكاميرا</button>
<div class="hint">سيتم قراءة الفاتورة وإضافتها تلقائيًا إلى المصروفات.</div>
<img id="expenseImg" class="ocr-preview hidden">
<div id="expenseStatus" class="hint"></div>
</div>
`,async()=>{
const f=$('#doc').files[0];
if(!f)return toast('اختر أو صوّر الفاتورة أولاً');

try{
$('#msave').disabled=true;
$('#expenseStatus').textContent='جاري قراءة الفاتورة...';

const imageData=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(f);
});

$('#expenseImg').src=imageData;
$('#expenseImg').classList.remove('hidden');

const response=await fetch(
`${window.SUPABASE_URL}/functions/v1/expense-ocr`,
{
method:'POST',
headers:{
'Content-Type':'application/json',
'apikey':window.SUPABASE_KEY,
'Authorization':`Bearer ${window.SUPABASE_KEY}`
},
body:JSON.stringify({image:imageData})
}
);

const ai=await response.json();

if(!response.ok){
console.error(ai);
throw new Error(ai.error||'تعذرت قراءة الفاتورة');
}

const amount=Number(
String(ai.total_amount||ai.net_amount||'0')
.replace(',','.')
.replace(/[^\d.-]/g,'')
)||0;

const expense={
id:id('x'),
companyId:session.company.id,
date:ai.expense_date||new Date().toISOString().slice(0,10),
note:ai.description||ai.supplier_name||'مصروف',
amount:amount,
category:ai.category||'مصروف',
supplier_name:ai.supplier_name||'',
net_amount:ai.net_amount||'',
tax_amount:ai.tax_amount||'',
total_amount:ai.total_amount||'',
payment_method:ai.payment_method||'',
receipt_number:ai.receipt_number||'',
notes:ai.notes||''
};

db.expenses.push(expense);
save();
audit('expense.create',expense.note);
closeModal();
render();
toast('تمت إضافة المصروف بنجاح');

}catch(e){
console.error(e);
$('#expenseStatus').textContent='تعذرت قراءة الفاتورة';
toast(e.message||'حدث خطأ');
$('#msave').disabled=false;
}
},'قراءة وإضافة');
}

 table(['التاريخ','الحساب','مدين','دائن','البيان'],rows.map(x=>[esc(x.date),esc(x.account),money(x.debit),money(x.credit),esc(x.note)]));
 $('#add').onclick=()=>simpleModal('قيد جديد',[['date','التاريخ','date'],['account','الحساب'],['debit','مدين','number'],['credit','دائن','number'],['note','البيان']],o=>{o.companyId=session.company.id;o.id=id('j');db.journal.push(o);save();audit('journal.create',o.account);render()});

 $('#content').innerHTML=head('التقارير')+`<div class="grid">

 <div class="card"><div class="muted">الفواتير</div><div class="metric">${inv.length}</div></div>

}

function simpleModal(title,fields,onSave){
 modal(title,`<div class="form-grid">${fields.map(([k,l,t='text'])=>`<div class="field"><label>${l}</label><input id="f_${k}" type="${t}"></div>`).join('')}</div>`,()=>{
  const o={};fields.forEach(([k])=>o[k]=$('#f_'+k).value);closeModal();onSave(o);
 });
}

  async function openCamera(){
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
return toast('الكاميرا غير مدعومة في هذا المتصفح');
}

const box=document.createElement('div');
box.className='modal-back';
box.innerHTML=`
<div class="modal" style="max-width:700px">
<div class="modal-head">
<b>📷 تصوير ورقة السيارة</b>
<button id="camClose" class="btn bad">✕</button>
</div>
<video id="cameraVideo" autoplay playsinline
style="width:100%;border-radius:12px;background:#000"></video>
<div style="margin-top:12px;text-align:center">
<button id="takePhoto" class="btn primary">📸 التقاط الصورة</button>
</div>
</div>
`;

document.body.appendChild(box);

const video=box.querySelector('#cameraVideo');
let stream;

try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:'environment'}},
audio:false
});

video.srcObject=stream;

const close=()=>{
if(stream) stream.getTracks().forEach(t=>t.stop());
box.remove();
};

box.querySelector('#camClose').onclick=close;

box.querySelector('#takePhoto').onclick=()=>{
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext('2d').drawImage(video,0,0);

canvas.toBlob(blob=>{
const file=new File([blob],'fahrzeugschein.jpg',{type:'image/jpeg'});
const dt=new DataTransfer();
dt.items.add(file);

const input=document.querySelector('#doc');
input.files=dt.files;
input.dispatchEvent(new Event('change',{bubbles:true}));

close();
toast('تم التقاط الصورة بنجاح');
},'image/jpeg',0.92);
};

}catch(e){
box.remove();
toast('لم يتم السماح باستخدام الكاميرا');
console.error(e);
}
}
