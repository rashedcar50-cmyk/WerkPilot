<head>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{--bg:#0b1220;--panel:#151f33;--panel2:#1d2940;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--pri:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#b91c1c;--font:16px}
*{box-sizing:border-box}
html{font-size:var(--font)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:22px}
.login-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px #0007}
.brand{font-size:2rem;font-weight:800}.tag{color:var(--muted);margin:6px 0 24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0f172a;color:var(--text)}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 15px;background:#334155;color:white;font-weight:700}
.btn.primary{background:var(--pri)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 10px;font-size:.9rem}.full{width:100%}
.hint,.muted{color:var(--muted);font-size:.92rem}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#0f172a;border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebrand{font-size:1.35rem;font-weight:800;margin-bottom:14px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{background:transparent;color:var(--text);border:0;border-radius:10px;padding:10px 12px;text-align:right}
.nav button.active,.nav button:hover{background:var(--panel2)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:8;background:#0f172aee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:18px;max-width:1400px;margin:auto}
.page-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{margin:0;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.metric{font-size:1.8rem;font-weight:800;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#1e293b;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px;background:var(--panel)}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#111827;position:sticky;top:0}
.status{padding:4px 8px;border-radius:999px;background:#334155}.status.ok{background:#14532d}.status.warn{background:#78350f}
.modal-back{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}
.filebox{border:1px dashed #64748b;border-radius:12px;padding:12px;background:#0f172a}
.ocr-preview{max-width:100%;max-height:220px;border-radius:10px;margin-top:10px}
.progress{height:8px;background:#334155;border-radius:999px;overflow:hidden;margin:8px 0}.progress>div{height:100%;width:0;background:#3b82f6}
.kpi-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mobile-menu{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;top:0;z-index:30;width:260px;transition:.2s}.sidebar.open{right:0}
  .mobile-menu{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.hide-mobile{display:none}}
</style>

<body>
<div id="app"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const storeKey='werkpilot_pro_v1';
const seed={
 users:[
  {u:'admin',p:'1234',name:'المدير',role:'manager'},
  {u:'accountant',p:'1234',name:'المحاسب',role:'accountant'},
  {u:'mechanic',p:'1234',name:'الميكانيكي',role:'mechanic'},
  {u:'warehouse',p:'1234',name:'أمين المستودع',role:'warehouse'}
 ],
 companies:[
  {id:'de',name:'Auto Service',country:'DE',currency:'EUR',docLang:'de'},
  {id:'es',name:'Auto Service España',country:'ES',currency:'EUR',docLang:'es'}
 ],
 customers:[],vehicles:[],repairs:[],estimates:[],invoices:[],purchases:[],inventory:[],
 employees:[],expenses:[],journal:[],audit:[],
 settings:{theme:'dark',font:16,uiLang:'ar'}
};
let db=load(), session=null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return {...clone(seed),...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch{return clone(seed)}}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function id(p='x'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(v){return Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2200)}
function audit(action,detail=''){db.audit.unshift({id:id('a'),ts:new Date().toISOString(),user:session?.user?.name||'system',company:session?.company?.id||'',action,detail});save()}
function companyRows(name){return db[name].filter(x=>x.companyId===session.company.id)}
function customerName(cid){return db.customers.find(c=>c.id===cid)?.name||'-'}
function vehicleName(vid){const v=db.vehicles.find(x=>x.id===vid);return v?`${v.plate||v.vin||'-'} · ${v.make||''} ${v.model||''}`:'-'}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function roleCan(section){
 const r=session.user.role;
 if(r==='manager') return true;
 if(r==='accountant') return !['settings'].includes(section);
 if(r==='mechanic') return ['dashboard','customers','vehicles','repairs','estimates','integrations'].includes(section);
 if(r==='warehouse') return ['dashboard','inventory','purchases','integrations'].includes(section);
 return false;
}

const nav=[
 ['dashboard','الرئيسية'],['customers','العملاء'],['vehicles','السيارات'],['repairs','أوامر الإصلاح'],
 ['estimates','Kostenvoranschlag'],['invoices','الفواتير و Barverkauf'],['purchases','المشتريات'],
 ['inventory','المخزون وقطع الغيار'],['employees','الموظفون والرواتب'],['expenses','المصاريف'],
 ['journal','دفتر اليومية'],['reports','التقارير'],['integrations','التكاملات'],
 ['audit','سجل النشاط'],['settings','الإعدادات']
];

function login(){
 document.documentElement.dir='rtl';
 $('#app').innerHTML=`<div class="login-screen"><div class="login-card">
 <div class="brand">WerkPilot Pro</div><div class="tag">إدارة الورشة الذكية</div>
 <div class="field"><label>اسم المستخدم</label><input id="lu" value="admin"></div>
 <div class="field"><label>كلمة المرور</label><input id="lp" type="password" value="1234"></div>
 <button class="btn primary full" id="loginBtn">دخول</button>
 <div class="hint" style="margin-top:12px">admin / 1234 · accountant / 1234 · mechanic / 1234 · warehouse / 1234</div>
 </div></div>`;
 $('#loginBtn').onclick=()=>{
  const u=db.users.find(x=>x.u===$('#lu').value&&x.p===$('#lp').value);
  if(!u)return toast('بيانات الدخول غير صحيحة');
  session={user:u,company:db.companies[0],page:'dashboard'};
  audit('login');render();
 };
}

function render(){
 document.documentElement.style.setProperty('--font',db.settings.font+'px');
 const allowed=nav.filter(([k])=>roleCan(k));
 $('#app').innerHTML=`<div class="shell">
 <aside class="sidebar" id="side"><div class="sidebrand">WerkPilot Pro</div><div class="nav">
 ${allowed.map(([k,l])=>`<button data-page="${k}" class="${session.page===k?'active':''}">${l}</button>`).join('')}
 </div></aside>
 <main class="main">
  <div class="topbar">
   <div class="top-actions"><button class="btn ghost mobile-menu" id="menu">☰</button>
   <select id="company">${db.companies.map(c=>`<option value="${c.id}" ${c.id===session.company.id?'selected':''}>${c.name} · ${c.country}</option>`).join('')}</select></div>
   <div class="top-actions"><span class="badge hide-mobile"><span class="dot"></span>${session.user.name}</span><button class="btn ghost small" id="logout">خروج</button></div>
  </div>
  <div class="content" id="content"></div>
 </main></div>`;
 $$('[data-page]').forEach(b=>b.onclick=()=>{session.page=b.dataset.page;render()});
 $('#logout').onclick=()=>{audit('logout');session=null;login()};
 $('#company').onchange=e=>{session.company=db.companies.find(c=>c.id===e.target.value);session.page='dashboard';render()};
 $('#menu').onclick=()=>$('#side').classList.toggle('open');
 page();
}
function page(){
 const m={dashboard,customers,vehicles,repairs,estimates,invoices,purchases,inventory,employees,expenses,journal,reports,integrations,audit:auditPage,settings};
 (m[session.page]||dashboard)();
}
function head(title,action=''){return `<div class="page-title"><h1>${title}</h1>${action}</div>`}
function table(headers,rows){
 if(!rows.length)return `<div class="card muted">لا توجد بيانات بعد.</div>`;
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
 <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function modal(title,body,onSave,saveText='حفظ'){
 $('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal">
 <div class="modal-head"><h2>${title}</h2><button class="btn ghost small" id="xmod">✕</button></div>
 ${body}<div class="toolbar" style="margin-top:14px"><button class="btn primary" id="msave">${saveText}</button><button class="btn ghost" id="mcancel">إلغاء</button></div>
 </div></div>`;
 $('#xmod').onclick=closeModal;$('#mcancel').onclick=closeModal;$('#msave').onclick=onSave;
}
function closeModal(){$('#modalRoot').innerHTML=''}

function dashboard(){
 const inv=companyRows('invoices'),exp=companyRows('expenses'),rep=companyRows('repairs'),veh=companyRows('vehicles');
 const sales=inv.reduce((a,x)=>a+Number(x.total||0),0),costs=exp.reduce((a,x)=>a+Number(x.amount||0),0);
 $('#content').innerHTML=head('لوحة التحكم')+`<div class="grid">
 <div class="card"><div class="muted">العملاء</div><div class="metric">${companyRows('customers').length}</div></div>
 <div class="card"><div class="muted">السيارات</div><div class="metric">${veh.length}</div></div>
 <div class="card"><div class="muted">أوامر الإصلاح المفتوحة</div><div class="metric">${rep.filter(x=>x.status!=='مكتمل').length}</div></div>
 <div class="card"><div class="muted">إجمالي المبيعات</div><div class="metric">${money(sales)}</div></div>
 ${session.user.role==='manager'?`<div class="card"><div class="muted">صافي تقريبي</div><div class="metric">${money(sales-costs)}</div></div>`:''}
 </div><div class="card" style="margin-top:14px"><div class="kpi-row"><b>الشركة النشطة</b><span class="badge">${session.company.name} · ${session.company.country}</span></div>
 <p class="muted">كل البيانات معزولة حسب الشركة النشطة.</p></div>`;
}

function customers(){
 const rows=companyRows('customers');
 $('#content').innerHTML=head('العملاء',`<button class="btn primary" id="add">عميل جديد</button>`)+
 table(['الاسم','الهاتف','الإيميل','العنوان','السيارات'],rows.map(c=>[esc(c.name),esc(c.phone||'-'),esc(c.email||'-'),esc(c.address||'-'),db.vehicles.filter(v=>v.customerId===c.id).length]));
 $('#add').onclick=customerModal;
}
function customerModal(){
 modal('عميل جديد',`<div class="form-grid">
 <div class="field"><label>الاسم</label><input id="n"></div>
 <div class="field"><label>الهاتف</label><input id="ph"></div>
 <div class="field"><label>الإيميل</label><input id="em"></div>
 <div class="field"><label>العنوان</label><input id="ad"></div>
 </div>`,()=>{
  const c={id:id('c'),companyId:session.company.id,name:$('#n').value.trim(),phone:$('#ph').value,email:$('#em').value,address:$('#ad').value};
  if(!c.name)return toast('أدخل اسم العميل');
  db.customers.push(c);save();audit('customer.create',c.name);closeModal();render();
 });
}

function vehicles(){
 const rows=companyRows('vehicles');
 $('#content').innerHTML=head('السيارات',`<div class="toolbar"><button class="btn primary" id="add">إضافة سيارة</button><button class="btn ok" id="scan">📷 تصوير ورقة السيارة</button></div>`)+
 table(['العميل','اللوحة','VIN','الماركة','الموديل','السنة','المحرك','اللون'],rows.map(v=>[customerName(v.customerId),esc(v.plate||'-'),esc(v.vin||'-'),esc(v.make||'-'),esc(v.model||'-'),esc(v.year||'-'),esc(v.engine||'-'),esc(v.paint||'-')]));
 $('#add').onclick=()=>vehicleModal();
 $('#scan').onclick=scanVehicleDocument;
}
function vehicleModal(prefill={}){
 const customers=companyRows('customers');
 modal('إضافة سيارة',`<div class="form-grid">
 <div class="field"><label>العميل</label><select id="cu"><option value="">اختر العميل</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div class="field"><label>رقم اللوحة</label><input id="pl" value="${esc(prefill.plate||'')}"></div>
 <div class="field"><label>VIN</label><input id="vin" value="${esc(prefill.vin||'')}"></div>
 <div class="field"><label>Partslink24</label><button type="button" class="btn" id="partslinkBtn">فتح partslink24</button></div>
 <div class="field"><label>الماركة</label><input id="mk" value="${esc(prefill.make||'')}"></div>
 <div class="field"><label>الموديل</label><input id="mo" value="${esc(prefill.model||'')}"></div>
 <div class="field"><label>السنة</label><input id="yr" type="number" value="${esc(prefill.year||'')}"></div>
 <div class="field"><label>سعة المحرك (cm³)</label><input id="cc" type="number" value="${esc(prefill.engine_displacement_cm3||'')}"></div>
 <div class="field"><label>نوع الوقود</label><input id="fuel" value="${esc(prefill.fuel_type||'')}"></div>
 <div class="field"><label>قوة المحرك (kW)</label><input id="kw" type="number" value="${esc(prefill.engine_power_kw||'')}"></div>
 <div class="field"><label>كود المحرك</label><input id="en" value="${esc(prefill.engine||'')}"></div>
 <div class="field"><label>كود اللون</label><input id="pa" value="${esc(prefill.paint||'')}"></div>
 </div>`,()=>{
  if(!$('#cu').value)return toast('اختر عميلاً أو أضف عميلاً أولاً');
  const v={id:id('v'),companyId:session.company.id,customerId:$('#cu').value,plate:$('#pl').value.trim(),vin:$('#vin').value.trim().toUpperCase(),make:$('#mk').value.trim(),model:$('#mo').value.trim(),year:$('#yr').value,engine:$('#en').value.trim(),paint:$('#pa').value.trim(),engine_displacement_cm3:$('#cc').value,fuel_type:$('#fuel').value,engine_power_kw:$('#kw').value,ocrSource:prefill.ocrSource||''};
  db.vehicles.push(v);save();audit('vehicle.create',v.plate||v.vin);closeModal();render();
 });
  $('#partslinkBtn').onclick=()=>{
window.open('https://www.partslink24.com/','_blank');
}; 
}
function scanVehicleDocument(){
 modal('تصوير/رفع ورقة السيارة',`<div class="field">
 <label>اختر صورة Fahrzeugschein / Zulassungsbescheinigung</label>
 <input id="doc" type="file" accept="image/*" capture="environment">
 <button type="button" id="camOpen" class="btn primary" onclick="openCamera()">📷 فتح الكاميرا</button>
 <div class="hint">تتم قراءة الصورة في المتصفح. راجع البيانات قبل الحفظ.</div>
 <img id="ocrImg" class="ocr-preview hidden">
 <div id="ocrBox" class="hidden"><div class="progress"><div id="ocrProg"></div></div><div id="ocrStatus" class="muted"></div></div>
 </div>`,async()=>{
  const f=$('#doc').files[0];if(!f)return toast('اختر أو صوّر الورقة أولاً');
  $('#ocrBox').classList.remove('hidden');
  $('#msave').disabled=true;
  try{
   const url=URL.createObjectURL(f);$('#ocrImg').src=url;$('#ocrImg').classList.remove('hidden');
   const imageData = await new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = () => resolve(reader.result);
reader.onerror = reject;
reader.readAsDataURL(f);
});

$('#ocrStatus').textContent = 'جارٍ قراءة ورقة السيارة بالذكاء الاصطناعي...';

const response = await fetch(
`${window.SUPABASE_URL}/functions/v1/vehicle-ocr`,
{
method: 'POST',
headers: {
'Content-Type': 'application/json',
'apikey': window.SUPABASE_KEY,
'Authorization': `Bearer ${window.SUPABASE_KEY}`
},
body: JSON.stringify({
image: imageData
})
}
   
);

const ai = await response.json();

if (!response.ok) {
console.error(ai);
throw new Error(ai.error || 'تعذرت قراءة ورقة السيارة');
}

const parsed = {
plate: ai.license_plate || '',
vin: ai.vin || '',
make: ai.brand || '',
model: ai.model || '',
year: ai.year || '',
engine_displacement_cm3: ai.engine_displacement_cm3 || '',
fuel_type: ai.fuel_type || '',
engine_power_kw: ai.engine_power_kw || '',
engine: ai.engine_code || '',
paint: ai.color || '',
firstRegistration: ai.first_registration || ''
};

closeModal();

vehicleModal({
...parsed,
ocrSource: f.name
});
   toast('تمت القراءة. راجع الحقول قبل الحفظ.');
  }catch(e){console.error(e);$('#ocrStatus').textContent='تعذرت القراءة التلقائية. يمكنك إدخال البيانات يدوياً.';$('#msave').disabled=false}
 },'قراءة البيانات');
 $('#doc').onchange=()=>{const f=$('#doc').files[0];if(f){const u=URL.createObjectURL(f);$('#ocrImg').src=u;$('#ocrImg').classList.remove('hidden')}};
}

function parseVehicleOCR(text){
const t = text
.replace(/\r/g,' ')
.replace(/[ \t]+/g,' ')
.replace(/\n+/g,'\n');

const upper = t.toUpperCase();

const vinMatch = upper.match(/\b[A-HJ-NPR-Z0-9]{17}\b/);

const plateMatch = upper.match(/\b[A-ZÄÖÜ]{1,3}[-\s][A-Z]{1,2}[-\s]?\d{1,4}[EH]?\b/);

const yearMatch =
t.match(/\b(19|20)\d{2}\b/) ||
t.match(/\b\d{2}\.\d{2}\.(19|20)\d{2}\b/);

const makes = [
'VOLKSWAGEN','VW','BMW','MERCEDES','AUDI','OPEL','FORD',
'TOYOTA','RENAULT','PEUGEOT','CITROEN','SKODA','SEAT',
'FIAT','HYUNDAI','KIA','PORSCHE','MAZDA','NISSAN',
'HONDA','VOLVO','DACIA','TESLA','MINI'
];

const make = makes.find(x => upper.includes(x)) || '';

const modelPatterns = [
/D\.3[:\s]+([A-Z0-9\- ]+)/i,
/HANDELSBEZEICHNUNG[:\s]+([A-Z0-9\- ]+)/i
];

let model = '';
for(const p of modelPatterns){
const m = t.match(p);
if(m){
model = m[1].trim();
break;
}
}

let firstRegistration = '';
const regMatch =
t.match(/B[:\s]+(\d{2}\.\d{2}\.\d{4})/i) ||
t.match(/\b(\d{2}\.\d{2}\.\d{4})\b/);

if(regMatch) firstRegistration = regMatch[1];

return {
vin: vinMatch?.[0] || '',
year: yearMatch?.[0]?.slice(-4) || '',
plate: plateMatch?.[0]?.replace(/\s+/g,'-') || '',
make,
model,
firstRegistration
};
}
function repairs(){
 const rows=companyRows('repairs');
 $('#content').innerHTML=head('أوامر الإصلاح',`<button class="btn primary" id="add">أمر إصلاح جديد</button>`)+

function financeModal(type){
 const title=type==='estimate'?'Kostenvoranschlag':type==='bar'?'Barverkauf':'فاتورة جديدة';
 modal(title,`<div class="form-grid">
 <div class="field"><label>السيارة</label><select id="fv"><option value="">بدون سيارة</option>${companyRows('vehicles').map(v=>`<option value="${v.id}">${esc(v.plate||v.vin)} · ${esc(v.make)} ${esc(v.model)}</option>`).join('')}</select></div>
 <div class="field"><label>القطع €</label><input id="fp" type="number" step=".01" value="0"></div>
 <div class="field"><label>الأجور €</label><input id="fl" type="number" step=".01" value="0"></div>
 <div class="field"><label>الخصم €</label><input id="fd" type="number" step=".01" value="0"></div>
 <div class="field"><label>الضريبة %</label><input id="ft" type="number" step=".01" value="19"></div>
 ${type==='estimate'?'<div class="field"><label>رسوم إعداد التقدير €</label><input id="ff" type="number" step=".01" value="0"></div>':'<div class="field"><label>طريقة الدفع</label><select id="pay"><option>غير محدد</option><option>نقدي</option><option>بطاقة</option><option>تحويل بنكي</option></select></div>'}
 </div>`,()=>{
  const parts=+$('#fp').value||0,labor=+$('#fl').value||0,discount=+$('#fd').value||0,tax=+$('#ft').value||0,net=Math.max(0,parts+labor-discount),total=net*(1+tax/100);
  const obj={id:id(type[0]),companyId:session.company.id,vehicleId:$('#fv').value,parts,labor,discount,tax,net,total};
  if(type==='estimate'){obj.fee=+$('#ff').value||0;db.estimates.push(obj);audit('estimate.create',money(total))}
  else{obj.type=type==='bar'?'Barverkauf':'فاتورة';obj.payment=$('#pay').value;db.invoices.push(obj);audit('invoice.create',money(total))}
  save();closeModal();render();
 });
}

  async function openCamera(){
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
return toast('الكاميرا غير مدعومة في هذا المتصفح');
}

const box=document.createElement('div');
box.className='modal-back';
box.innerHTML=`
<div class="modal" style="max-width:700px">
<div class="modal-head">
<b>📷 تصوير ورقة السيارة</b>
<button id="camClose" class="btn bad">✕</button>
</div>
<video id="cameraVideo" autoplay playsinline
style="width:100%;border-radius:12px;background:#000"></video>
<div style="margin-top:12px;text-align:center">
<button id="takePhoto" class="btn primary">📸 التقاط الصورة</button>
</div>
</div>
`;

document.body.appendChild(box);

const video=box.querySelector('#cameraVideo');
let stream;

try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:'environment'}},
audio:false
});

video.srcObject=stream;

const close=()=>{
if(stream) stream.getTracks().forEach(t=>t.stop());
box.remove();
};

box.querySelector('#camClose').onclick=close;

box.querySelector('#takePhoto').onclick=()=>{
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext('2d').drawImage(video,0,0);

canvas.toBlob(blob=>{
const file=new File([blob],'fahrzeugschein.jpg',{type:'image/jpeg'});
const dt=new DataTransfer();
dt.items.add(file);

const input=document.querySelector('#doc');
input.files=dt.files;
input.dispatchEvent(new Event('change',{bubbles:true}));

close();
toast('تم التقاط الصورة بنجاح');
},'image/jpeg',0.92);
};

}catch(e){
box.remove();
toast('لم يتم السماح باستخدام الكاميرا');
console.error(e);
}
}
