<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WerkPilot</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#fff}
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login{width:100%;max-width:420px;background:#1e293b;padding:28px;border-radius:22px;box-shadow:0 20px 50px #0006}
    h1{margin:0 0 5px;font-size:30px}.sub{color:#94a3b8;margin-bottom:24px}
    label{display:block;margin:14px 0 6px}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px}
    button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:17px;font-weight:700}
    .hint{margin-top:15px;color:#94a3b8;font-size:13px}
    header{padding:18px;background:#111827;display:flex;justify-content:space-between;align-items:center}
    .wrap{padding:18px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .card{background:#1e293b;padding:20px;border-radius:18px;min-height:110px;cursor:pointer}
    .icon{font-size:30px;margin-bottom:10px}
    .name{font-weight:700}
    .logout{width:auto;margin:0;padding:8px 14px;background:#334155}
    .vehicle-card{background:#1e293b;padding:16px;border-radius:14px;margin-bottom:10px;line-height:1.8}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById("app");

function showLogin(){
  app.innerHTML = `
    <div class="center">
      <div class="login">
        <h1>WerkPilot</h1>
        <div class="sub">إدارة الورشة الذكية</div>
        <label>اسم المستخدم</label>
        <input id="user" value="admin">
        <label>كلمة المرور</label>
        <input id="pass" type="password" value="1234">
        <button id="loginBtn">دخول</button>
        <div class="hint">بيانات التجربة: admin / 1234</div>
      </div>
    </div>`;
  document.getElementById("loginBtn").onclick = function(){
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    if(u === "admin" && p === "1234"){ showDashboard(); }
    else { alert("بيانات الدخول غير صحيحة"); }
  };
}

function showDashboard(){
  app.innerHTML = `
    <header>
      <strong>WerkPilot</strong>
      <button class="logout" id="logout">خروج</button>
    </header>
    <div class="wrap">
      <h2>لوحة التحكم</h2>
      <div class="grid">
        <div class="card"><div class="icon">👤</div><div class="name">العملاء</div></div>
        <div class="card" id="vehiclesCard"><div class="icon">🚗</div><div class="name">السيارات</div></div>
        <div class="card"><div class="icon">🔧</div><div class="name">أوامر الإصلاح</div></div>
        <div class="card"><div class="icon">🧾</div><div class="name">الفواتير</div></div>
        <div class="card"><div class="icon">📦</div><div class="name">المخزون</div></div>
        <div class="card"><div class="icon">🛒</div><div class="name">المشتريات</div></div>
        <div class="card"><div class="icon">👥</div><div class="name">الموظفون</div></div>
        <div class="card"><div class="icon">📊</div><div class="name">التقارير</div></div>
      </div>
    </div>`;
  document.getElementById("logout").onclick = showLogin;
  document.getElementById("vehiclesCard").onclick = showVehicles;
}

function showVehicles(){
  app.innerHTML = `
    <header>
      <strong>WerkPilot</strong>
      <button class="logout" id="backBtn">رجوع</button>
    </header>
    <div class="wrap">
      <h2>السيارات</h2>
      <div class="login" style="max-width:none">
        <label>رقم اللوحة</label>
        <input id="plate" placeholder="مثال: B-AB 1234">
        <label>VIN</label>
        <input id="vin" placeholder="رقم الهيكل">
        <label>الماركة</label>
        <input id="make" placeholder="BMW">
        <label>الموديل</label>
        <input id="model" placeholder="320d">
        <label>السنة</label>
        <input id="year" type="number" placeholder="2022">
        <label>اسم العميل</label>
        <input id="owner" placeholder="اسم العميل">
        <button id="saveVehicleBtn">حفظ السيارة</button>
      </div>
      <div id="vehicleList" style="margin-top:20px"></div>
    </div>`;
  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveVehicleBtn").onclick = saveVehicle;
  renderVehicles();
}

function saveVehicle(){
  const vehicles = JSON.parse(localStorage.getItem("werkpilot_vehicles") || "[]");
  const vehicle = {
    plate: document.getElementById("plate").value.trim(),
    vin: document.getElementById("vin").value.trim(),
    make: document.getElementById("make").value.trim(),
    model: document.getElementById("model").value.trim(),
    year: document.getElementById("year").value.trim(),
    owner: document.getElementById("owner").value.trim()
  };
  if(!vehicle.plate && !vehicle.vin){
    alert("أدخل رقم اللوحة أو VIN");
    return;
  }
  vehicles.push(vehicle);
  localStorage.setItem("werkpilot_vehicles", JSON.stringify(vehicles));
  showVehicles();
}

function renderVehicles(){
  const vehicles = JSON.parse(localStorage.getItem("werkpilot_vehicles") || "[]");
  const list = document.getElementById("vehicleList");
  if(!vehicles.length){
    list.innerHTML = `<div class="hint">لا توجد سيارات مسجلة بعد.</div>`;
    return;
  }
  list.innerHTML = vehicles.map(v => `
    <div class="vehicle-card">
      <b>${v.make || "-"} ${v.model || ""}</b><br>
      اللوحة: ${v.plate || "-"}<br>
      VIN: ${v.vin || "-"}<br>
      السنة: ${v.year || "-"}<br>
      العميل: ${v.owner || "-"}
    </div>`).join("");
}

showLogin();
</script>
</body>
</html>
