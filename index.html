<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WerkPilot</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0f172a;
      color:#fff;
    }
    .center{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .panel{
      width:100%;
      max-width:430px;
      background:#1e293b;
      padding:28px;
      border-radius:22px;
      box-shadow:0 20px 50px #0006;
    }
    h1{margin:0 0 6px;font-size:30px}
    h2{margin:0 0 20px}
    .sub{color:#94a3b8;margin-bottom:24px}
    label{display:block;margin:14px 0 6px}
    input, select, textarea{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #475569;
      background:#0f172a;
      color:#fff;
      font-size:16px;
    }
    textarea{min-height:100px;resize:vertical}
    button{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#2563eb;
      color:#fff;
      font-size:17px;
      font-weight:700;
    }
    .hint{
      margin-top:15px;
      color:#94a3b8;
      font-size:13px;
    }
    header{
      padding:18px;
      background:#111827;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:5;
    }
    .wrap{padding:18px}
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .card{
      background:#1e293b;
      padding:20px;
      border-radius:18px;
      min-height:110px;
      cursor:pointer;
    }
    .icon{font-size:30px;margin-bottom:10px}
    .name{font-weight:700}
    .smallbtn{
      width:auto;
      margin:0;
      padding:8px 14px;
      background:#334155;
    }
    .item-card{
      background:#1e293b;
      padding:16px;
      border-radius:14px;
      margin-bottom:10px;
      line-height:1.8;
    }
    .item-actions{
      display:flex;
      gap:8px;
      margin-top:12px;
    }
    .item-actions button{
      margin:0;
      padding:8px 12px;
      font-size:14px;
    }
    .danger{background:#b91c1c}
    .secondary{background:#475569}
    .stats{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .stat{
      background:#1e293b;
      border-radius:16px;
      padding:18px;
      text-align:center;
    }
    .stat strong{display:block;font-size:28px;margin-top:8px}
    .empty{
      color:#94a3b8;
      text-align:center;
      padding:20px;
    }
    @media(min-width:700px){
      .grid{grid-template-columns:repeat(4,1fr)}
      .stats{grid-template-columns:repeat(4,1fr)}
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById("app");

const STORE = {
  customers: "werkpilot_customers",
  vehicles: "werkpilot_vehicles",
  repairs: "werkpilot_repairs",
  invoices: "werkpilot_invoices",
  inventory: "werkpilot_inventory",
  purchases: "werkpilot_purchases",
  employees: "werkpilot_employees"
};

function load(key){
  return JSON.parse(localStorage.getItem(key) || "[]");
}

function save(key, data){
  localStorage.setItem(key, JSON.stringify(data));
}

function showLogin(){
  app.innerHTML = `
    <div class="center">
      <div class="panel">
        <h1>WerkPilot</h1>
        <div class="sub">إدارة الورشة الذكية</div>

        <label>اسم المستخدم</label>
        <input id="user" value="admin">

        <label>كلمة المرور</label>
        <input id="pass" type="password" value="1234">

        <button id="loginBtn">دخول</button>

        <div class="hint">بيانات التجربة: admin / 1234</div>
      </div>
    </div>
  `;

  document.getElementById("loginBtn").onclick = () => {
    const u = document.getElementById("user").value.trim();
    const p = document.getElementById("pass").value.trim();

    if(u === "admin" && p === "1234"){
      showDashboard();
    } else {
      alert("بيانات الدخول غير صحيحة");
    }
  };
}

function showDashboard(){
  app.innerHTML = `
    <header>
      <strong>WerkPilot</strong>
      <button class="smallbtn" id="logoutBtn">خروج</button>
    </header>

    <div class="wrap">
      <h2>لوحة التحكم</h2>

      <div class="grid">
        <div class="card" id="customersCard">
          <div class="icon">👤</div>
          <div class="name">العملاء</div>
        </div>

        <div class="card" id="vehiclesCard">
          <div class="icon">🚗</div>
          <div class="name">السيارات</div>
        </div>

        <div class="card" id="repairsCard">
          <div class="icon">🔧</div>
          <div class="name">أوامر الإصلاح</div>
        </div>

        <div class="card" id="invoicesCard">
          <div class="icon">🧾</div>
          <div class="name">الفواتير</div>
        </div>

        <div class="card" id="inventoryCard">
          <div class="icon">📦</div>
          <div class="name">المخزون</div>
        </div>

        <div class="card" id="purchasesCard">
          <div class="icon">🛒</div>
          <div class="name">المشتريات</div>
        </div>

        <div class="card" id="employeesCard">
          <div class="icon">👥</div>
          <div class="name">الموظفون</div>
        </div>

        <div class="card" id="reportsCard">
          <div class="icon">📊</div>
          <div class="name">التقارير</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById("logoutBtn").onclick = showLogin;
  document.getElementById("customersCard").onclick = showCustomers;
  document.getElementById("vehiclesCard").onclick = showVehicles;
  document.getElementById("repairsCard").onclick = showRepairs;
  document.getElementById("invoicesCard").onclick = showInvoices;
  document.getElementById("inventoryCard").onclick = showInventory;
  document.getElementById("purchasesCard").onclick = showPurchases;
  document.getElementById("employeesCard").onclick = showEmployees;
  document.getElementById("reportsCard").onclick = showReports;
}

function sectionHeader(title){
  return `
    <header>
      <strong>WerkPilot</strong>
      <button class="smallbtn" id="backBtn">رجوع</button>
    </header>
    <div class="wrap">
      <h2>${title}</h2>
  `;
}

function renderSimpleList(storageKey, labels){
  const items = load(storageKey);
  const list = document.getElementById("itemsList");

  if(!items.length){
    list.innerHTML = `<div class="empty">لا توجد بيانات مسجلة بعد.</div>`;
    return;
  }

  list.innerHTML = items.map((item, index) => `
    <div class="item-card">
      ${labels.map(x => `<b>${x.label}:</b> ${item[x.key] || "-"}<br>`).join("")}
      <div class="item-actions">
        <button class="danger" onclick="deleteItem('${storageKey}', ${index}, '${window.currentSection || ""}')">حذف</button>
      </div>
    </div>
  `).join("");
}

function deleteItem(storageKey, index, section){
  const items = load(storageKey);
  items.splice(index,1);
  save(storageKey, items);

  if(section === "customers") showCustomers();
  if(section === "vehicles") showVehicles();
  if(section === "repairs") showRepairs();
  if(section === "invoices") showInvoices();
  if(section === "inventory") showInventory();
  if(section === "purchases") showPurchases();
  if(section === "employees") showEmployees();
}

function showCustomers(){
  window.currentSection = "customers";
  app.innerHTML = sectionHeader("العملاء") + `
      <div class="panel" style="max-width:none">
        <label>اسم العميل</label>
        <input id="c_name" placeholder="اسم العميل">

        <label>رقم الهاتف</label>
        <input id="c_phone" placeholder="+49...">

        <label>البريد الإلكتروني</label>
        <input id="c_email" type="email" placeholder="name@example.com">

        <label>العنوان</label>
        <input id="c_address" placeholder="العنوان">

        <button id="saveCustomerBtn">حفظ العميل</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveCustomerBtn").onclick = () => {
    const items = load(STORE.customers);
    items.push({
      name: document.getElementById("c_name").value.trim(),
      phone: document.getElementById("c_phone").value.trim(),
      email: document.getElementById("c_email").value.trim(),
      address: document.getElementById("c_address").value.trim()
    });
    save(STORE.customers, items);
    showCustomers();
  };

  renderSimpleList(STORE.customers, [
    {label:"الاسم",key:"name"},
    {label:"الهاتف",key:"phone"},
    {label:"البريد",key:"email"},
    {label:"العنوان",key:"address"}
  ]);
}

function showVehicles(){
  window.currentSection = "vehicles";
  app.innerHTML = sectionHeader("السيارات") + `
      <div class="panel" style="max-width:none">
        <label>رقم اللوحة</label>
        <input id="v_plate" placeholder="مثال: B-AB 1234">

        <label>VIN</label>
        <input id="v_vin" placeholder="رقم الهيكل">

        <label>الماركة</label>
        <input id="v_make" placeholder="BMW">

        <label>الموديل</label>
        <input id="v_model" placeholder="320d">

        <label>السنة</label>
        <input id="v_year" type="number" placeholder="2022">

        <label>اسم العميل</label>
        <input id="v_owner" placeholder="اسم العميل">

        <button id="saveVehicleBtn">حفظ السيارة</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveVehicleBtn").onclick = () => {
    const items = load(STORE.vehicles);
    const vehicle = {
      plate: document.getElementById("v_plate").value.trim(),
      vin: document.getElementById("v_vin").value.trim(),
      make: document.getElementById("v_make").value.trim(),
      model: document.getElementById("v_model").value.trim(),
      year: document.getElementById("v_year").value.trim(),
      owner: document.getElementById("v_owner").value.trim()
    };
    if(!vehicle.plate && !vehicle.vin){
      alert("أدخل رقم اللوحة أو VIN");
      return;
    }
    items.push(vehicle);
    save(STORE.vehicles, items);
    showVehicles();
  };

  renderSimpleList(STORE.vehicles, [
    {label:"اللوحة",key:"plate"},
    {label:"VIN",key:"vin"},
    {label:"الماركة",key:"make"},
    {label:"الموديل",key:"model"},
    {label:"السنة",key:"year"},
    {label:"العميل",key:"owner"}
  ]);
}

function showRepairs(){
  window.currentSection = "repairs";
  app.innerHTML = sectionHeader("أوامر الإصلاح") + `
      <div class="panel" style="max-width:none">
        <label>رقم أمر الإصلاح</label>
        <input id="r_number" placeholder="RO-001">

        <label>السيارة / اللوحة</label>
        <input id="r_vehicle" placeholder="B-AB 1234">

        <label>اسم العميل</label>
        <input id="r_customer" placeholder="اسم العميل">

        <label>وصف العطل</label>
        <textarea id="r_issue" placeholder="وصف المشكلة"></textarea>

        <label>حالة الإصلاح</label>
        <select id="r_status">
          <option>جديد</option>
          <option>قيد الفحص</option>
          <option>قيد الإصلاح</option>
          <option>جاهز</option>
          <option>تم التسليم</option>
        </select>

        <label>التكلفة التقديرية</label>
        <input id="r_estimate" type="number" step="0.01" placeholder="0.00">

        <button id="saveRepairBtn">حفظ أمر الإصلاح</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveRepairBtn").onclick = () => {
    const items = load(STORE.repairs);
    items.push({
      number: document.getElementById("r_number").value.trim(),
      vehicle: document.getElementById("r_vehicle").value.trim(),
      customer: document.getElementById("r_customer").value.trim(),
      issue: document.getElementById("r_issue").value.trim(),
      status: document.getElementById("r_status").value,
      estimate: document.getElementById("r_estimate").value.trim()
    });
    save(STORE.repairs, items);
    showRepairs();
  };

  renderSimpleList(STORE.repairs, [
    {label:"رقم الأمر",key:"number"},
    {label:"السيارة",key:"vehicle"},
    {label:"العميل",key:"customer"},
    {label:"العطل",key:"issue"},
    {label:"الحالة",key:"status"},
    {label:"التكلفة التقديرية",key:"estimate"}
  ]);
}

function showInvoices(){
  window.currentSection = "invoices";
  app.innerHTML = sectionHeader("الفواتير") + `
      <div class="panel" style="max-width:none">
        <label>رقم الفاتورة</label>
        <input id="i_number" placeholder="INV-001">

        <label>اسم العميل</label>
        <input id="i_customer" placeholder="اسم العميل">

        <label>السيارة / اللوحة</label>
        <input id="i_vehicle" placeholder="B-AB 1234">

        <label>المبلغ الصافي</label>
        <input id="i_net" type="number" step="0.01" placeholder="0.00">

        <label>الضريبة %</label>
        <input id="i_tax" type="number" step="0.01" value="19">

        <label>الحالة</label>
        <select id="i_status">
          <option>مفتوحة</option>
          <option>مدفوعة</option>
          <option>ملغاة</option>
        </select>

        <button id="saveInvoiceBtn">حفظ الفاتورة</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveInvoiceBtn").onclick = () => {
    const items = load(STORE.invoices);
    const net = Number(document.getElementById("i_net").value || 0);
    const tax = Number(document.getElementById("i_tax").value || 0);
    const total = net + (net * tax / 100);

    items.push({
      number: document.getElementById("i_number").value.trim(),
      customer: document.getElementById("i_customer").value.trim(),
      vehicle: document.getElementById("i_vehicle").value.trim(),
      net: net.toFixed(2),
      tax: tax.toFixed(2) + "%",
      total: total.toFixed(2),
      status: document.getElementById("i_status").value
    });

    save(STORE.invoices, items);
    showInvoices();
  };

  renderSimpleList(STORE.invoices, [
    {label:"رقم الفاتورة",key:"number"},
    {label:"العميل",key:"customer"},
    {label:"السيارة",key:"vehicle"},
    {label:"الصافي",key:"net"},
    {label:"الضريبة",key:"tax"},
    {label:"الإجمالي",key:"total"},
    {label:"الحالة",key:"status"}
  ]);
}

function showInventory(){
  window.currentSection = "inventory";
  app.innerHTML = sectionHeader("المخزون") + `
      <div class="panel" style="max-width:none">
        <label>رقم القطعة</label>
        <input id="inv_sku" placeholder="SKU">

        <label>اسم القطعة</label>
        <input id="inv_name" placeholder="اسم القطعة">

        <label>الكمية</label>
        <input id="inv_qty" type="number" placeholder="0">

        <label>سعر الشراء</label>
        <input id="inv_buy" type="number" step="0.01" placeholder="0.00">

        <label>سعر البيع</label>
        <input id="inv_sell" type="number" step="0.01" placeholder="0.00">

        <button id="saveInventoryBtn">حفظ الصنف</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveInventoryBtn").onclick = () => {
    const items = load(STORE.inventory);
    items.push({
      sku: document.getElementById("inv_sku").value.trim(),
      name: document.getElementById("inv_name").value.trim(),
      qty: document.getElementById("inv_qty").value.trim(),
      buy: document.getElementById("inv_buy").value.trim(),
      sell: document.getElementById("inv_sell").value.trim()
    });
    save(STORE.inventory, items);
    showInventory();
  };

  renderSimpleList(STORE.inventory, [
    {label:"رقم القطعة",key:"sku"},
    {label:"اسم القطعة",key:"name"},
    {label:"الكمية",key:"qty"},
    {label:"سعر الشراء",key:"buy"},
    {label:"سعر البيع",key:"sell"}
  ]);
}

function showPurchases(){
  window.currentSection = "purchases";
  app.innerHTML = sectionHeader("المشتريات") + `
      <div class="panel" style="max-width:none">
        <label>المورد</label>
        <input id="p_supplier" placeholder="اسم المورد">

        <label>رقم الفاتورة</label>
        <input id="p_invoice" placeholder="رقم فاتورة المورد">

        <label>الصنف</label>
        <input id="p_item" placeholder="اسم الصنف">

        <label>الكمية</label>
        <input id="p_qty" type="number" placeholder="0">

        <label>المبلغ</label>
        <input id="p_amount" type="number" step="0.01" placeholder="0.00">

        <label>التاريخ</label>
        <input id="p_date" type="date">

        <button id="savePurchaseBtn">حفظ الشراء</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("savePurchaseBtn").onclick = () => {
    const items = load(STORE.purchases);
    items.push({
      supplier: document.getElementById("p_supplier").value.trim(),
      invoice: document.getElementById("p_invoice").value.trim(),
      item: document.getElementById("p_item").value.trim(),
      qty: document.getElementById("p_qty").value.trim(),
      amount: document.getElementById("p_amount").value.trim(),
      date: document.getElementById("p_date").value
    });
    save(STORE.purchases, items);
    showPurchases();
  };

  renderSimpleList(STORE.purchases, [
    {label:"المورد",key:"supplier"},
    {label:"رقم الفاتورة",key:"invoice"},
    {label:"الصنف",key:"item"},
    {label:"الكمية",key:"qty"},
    {label:"المبلغ",key:"amount"},
    {label:"التاريخ",key:"date"}
  ]);
}

function showEmployees(){
  window.currentSection = "employees";
  app.innerHTML = sectionHeader("الموظفون") + `
      <div class="panel" style="max-width:none">
        <label>اسم الموظف</label>
        <input id="e_name" placeholder="اسم الموظف">

        <label>الوظيفة</label>
        <input id="e_role" placeholder="ميكانيكي / محاسب ...">

        <label>الهاتف</label>
        <input id="e_phone" placeholder="+49...">

        <label>البريد الإلكتروني</label>
        <input id="e_email" type="email" placeholder="name@example.com">

        <button id="saveEmployeeBtn">حفظ الموظف</button>
      </div>

      <div id="itemsList" style="margin-top:20px"></div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
  document.getElementById("saveEmployeeBtn").onclick = () => {
    const items = load(STORE.employees);
    items.push({
      name: document.getElementById("e_name").value.trim(),
      role: document.getElementById("e_role").value.trim(),
      phone: document.getElementById("e_phone").value.trim(),
      email: document.getElementById("e_email").value.trim()
    });
    save(STORE.employees, items);
    showEmployees();
  };

  renderSimpleList(STORE.employees, [
    {label:"الاسم",key:"name"},
    {label:"الوظيفة",key:"role"},
    {label:"الهاتف",key:"phone"},
    {label:"البريد",key:"email"}
  ]);
}

function showReports(){
  const customers = load(STORE.customers).length;
  const vehicles = load(STORE.vehicles).length;
  const repairs = load(STORE.repairs).length;
  const invoices = load(STORE.invoices);
  const inventory = load(STORE.inventory).length;
  const purchases = load(STORE.purchases);
  const employees = load(STORE.employees).length;

  const paidInvoices = invoices.filter(x => x.status === "مدفوعة").length;
  const invoiceTotal = invoices.reduce((s,x) => s + Number(x.total || 0), 0);
  const purchaseTotal = purchases.reduce((s,x) => s + Number(x.amount || 0), 0);

  app.innerHTML = sectionHeader("التقارير") + `
      <div class="stats">
        <div class="stat">العملاء<strong>${customers}</strong></div>
        <div class="stat">السيارات<strong>${vehicles}</strong></div>
        <div class="stat">أوامر الإصلاح<strong>${repairs}</strong></div>
        <div class="stat">الفواتير<strong>${invoices.length}</strong></div>
        <div class="stat">الفواتير المدفوعة<strong>${paidInvoices}</strong></div>
        <div class="stat">أصناف المخزون<strong>${inventory}</strong></div>
        <div class="stat">المشتريات<strong>${purchases.length}</strong></div>
        <div class="stat">الموظفون<strong>${employees}</strong></div>
      </div>

      <div class="item-card" style="margin-top:20px">
        <b>إجمالي قيمة الفواتير:</b> ${invoiceTotal.toFixed(2)} EUR<br>
        <b>إجمالي المشتريات:</b> ${purchaseTotal.toFixed(2)} EUR<br>
        <b>الفرق التقريبي:</b> ${(invoiceTotal - purchaseTotal).toFixed(2)} EUR
      </div>
    </div>`;

  document.getElementById("backBtn").onclick = showDashboard;
}

showLogin();
</script>
</body>
</html>
