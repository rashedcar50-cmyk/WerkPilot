<style>
:root{--bg:#0B0E14;--panel:#161B24;--panel2:#1C222E;--line:#2A3140;--text:#F4F1EA;--muted:#9AA3B2;--pri:#E8A54B;--ok:#3D8B5F;--warn:#C9842A;--bad:#B5463A;--font:16px}
*{box-sizing:border-box}
html{font-size:var(--font)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(1200px 600px at 70% 40%,#1a1510 0%,#0B0E14 55%)}
.login-card{width:min(460px,100%);background:rgba(22,27,36,.88);border:1px solid #E8A54B55;border-radius:24px;padding:26px;box-shadow:0 24px 70px #000a;backdrop-filter:blur(10px)}
.brand-mark{display:flex;align-items:center;gap:10px;font-size:1.8rem;font-weight:800}
.brand-b{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#E8A54B,#b87333);display:grid;place-items:center;color:#111;font-weight:900}
.car-thumb{width:72px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#111}
.car-thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.brand{font-size:2rem;font-weight:800}.tag{color:var(--muted);margin:6px 0 24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#10141c;color:var(--text)}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 15px;background:#334155;color:white;font-weight:700}
.btn.primary{background:var(--pri)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 10px;font-size:.9rem}.full{width:100%}
.hint,.muted{color:var(--muted);font-size:.92rem}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#10141c;border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebrand{font-size:1.35rem;font-weight:800;margin-bottom:14px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{background:transparent;color:var(--text);border:0;border-radius:10px;padding:10px 12px;text-align:right}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--pri)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:8;background:#0B0E14ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:18px;max-width:1400px;margin:auto}
.page-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{margin:0;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.metric{font-size:1.8rem;font-weight:800;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#1e293b;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px;background:var(--panel)}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#10141c;position:sticky;top:0}
.status{padding:4px 8px;border-radius:999px;background:#334155}.status.ok{background:#14532d}.status.warn{background:#78350f}
.modal-back{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}

.filebox{border:1px dashed #64748b;border-radius:12px;padding:12px;background:#0f172a}

.kpi-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mobile-menu{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}.sidebar{position:fixed;right:-280px;top:0;z-index:30;width:260px;transition:.2s}.sidebar.open{right:0}
  .mobile-menu{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.hide-mobile{display:none}}

@media print{
  .sidebar,.topbar,.toolbar,.btn,.nav,.mobile-menu,.bottom-nav,#modalRoot,.toast{display:none!important}
  .shell{display:block}
  .main,.content{padding:0;max-width:100%}
  body{background:#fff;color:#000}
  .card,table{border-color:#ccc}
  th{background:#eee!important;color:#000}

.print-doc .meta{color:#555;margin-bottom:16px;font-size:13px}

.bottom-nav{display:none}
.repair-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}

  .bottom-nav button{flex:1;background:transparent;border:0;color:var(--muted);font-size:.72rem;padding:8px 4px}
  .bottom-nav button.active{color:var(--pri);font-weight:800}
}

let db=load(), session=null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(storeKey)||'{}');
  const base=clone(seed);
  const merged={...base,...raw};
  // إذا المجموعات فاضية استخدم بيانات التجربة من seed
  ['customers','vehicles','repairs','invoices','purchases','inventory','employees','expenses','appointments','estimates','journal'].forEach(k=>{
   if(!Array.isArray(merged[k]) || merged[k].length===0) merged[k]=clone(seed[k]||[]);
  });
  if(!Array.isArray(merged.katyCache)) merged.katyCache=[];
  if(!merged.settings) merged.settings=clone(seed.settings);
  merged.settings={...clone(seed.settings),...merged.settings};

  if(!Array.isArray(merged.users) || !merged.users.length) merged.users=clone(seed.users);
  if(!merged.users.some(u=>u.role==='developer')) merged.users.push({u:'owner',p:'bm-dev-2026',name:'صاحب الورشة / تطوير',role:'developer'});
  if(!Array.isArray(merged.companies) || !merged.companies.length) merged.companies=clone(seed.companies);
  ensureCompanyProfiles(merged);
  return merged;
 }catch{return clone(seed)}
}
const WORKSHOP_KEYS=['workshopBrand','workshopName','workshopAddress','workshopPhone','workshopEmail','workshopTaxId','workshopSteuerNr','workshopCourt','workshopOwner','workshopBank','workshopIban','workshopAccountHolder','workshopHrb','workshopBic','workshopSitz','hourlyRate','invoiceSeq','auftragSeq','paymentDays','invoiceTpl','printPaper','printMargin','printColor'];
function defaultWorkshopProfile(co, settings){
  const s=settings||(typeof db!=='undefined'&&db&&db.settings)||seed.settings;
  const isDe=co.id==='de' || co.country==='DE';
  const p={};
  WORKSHOP_KEYS.forEach(k=>{ p[k]= isDe ? (s[k]??seed.settings[k]) : (s[k]??''); });
  if(!isDe){
    p.workshopBrand=co.name||'Werkstatt';
    p.workshopName=co.name||'';
    p.workshopAccountHolder=co.name||'';
    p.invoiceSeq=0; p.auftragSeq=0; p.hourlyRate=100; p.paymentDays=0;
    p.invoiceTpl='modern'; p.printPaper='A4'; p.printMargin='8mm'; p.printColor=true;
    p.workshopTaxId=''; p.workshopIban=''; p.workshopHrb=''; p.workshopBic='';
  }
  p.docLang=co.docLang|| (co.country==='DE'?'de':'de');
  p.currency=co.currency||'EUR';
  return p;
}
function ensureCompanyProfiles(store){
  const st=store||db;
  if(!Array.isArray(st.companies)) st.companies=clone(seed.companies);
  st.companies.forEach(co=>{
    if(!co.profile) co.profile=defaultWorkshopProfile(co, st.settings);
    WORKSHOP_KEYS.forEach(k=>{ if(co.profile[k]===undefined) co.profile[k]=defaultWorkshopProfile(co, st.settings)[k]; });
  });
}

/* ===== Supabase data layer (purchases أولاً) ===== */
async function sbReady(){
  return !!(window.supabaseClient);
}

async function loadPurchasesFromCloud(){
  try{
    const sb = window.supabaseClient;
    if(!sb) return false;
    let q=sb.from('purchases').select('*').order('purchase_date', { ascending: false });
    q=cloudCompanyFilter(q);
    const { data, error } = await q;
    if(error){ console.warn('loadPurchases', error.message); return false; }
    if(!Array.isArray(data)) return false;
    mergeByCompany('purchases', data.map(r => ({
      id: 'p_cloud_' + r.id,
      cloudId: r.id,
      companyId: r.company_id || 'de',
      supplier: r.supplier || '',
      invoice_number: r.invoice_number || '',
      item: r.item || '',
      qty: r.qty,
      price: r.price,
      subtotal: r.subtotal,
      tax_amount: r.tax_amount,
      total_amount: r.total_amount,
      date: r.purchase_date || r.date || '',
      payment_status: r.payment_status || r.status || 'pending',
      notes: r.notes || '',
      receipt_url: r.receipt_url || ''
    })));
    save();
    return true;
  }catch(e){ console.warn(e); return false; }
}

async function upsertPurchaseCloud(p){
  try{
    const sb = window.supabaseClient;
    if(!sb) return;
    const row = {
      // company_id في قاعدة البيانات bigint FK — نتركه null مؤقتاً لتجنب خطأ المفتاح الأجنبي
      supplier: p.supplier || '',
      invoice_number: p.invoice_number || '',
      item: p.item || '',
      qty: Number(p.qty ?? 1),
      price: Number(p.price ?? 0),
      subtotal: Number(p.subtotal ?? 0),
      tax_amount: Number(p.tax_amount ?? 0),
      total_amount: Number(p.total_amount ?? 0),
      purchase_date: p.date || new Date().toISOString().slice(0,10),
      payment_status: p.payment_status || 'pending',
      notes: p.notes || '',
      receipt_url: p.receipt_url || ''
    };
    // إذا id رقمي من السحابة نحدّث، وإلا ندرج صف جديد
    let error;
    if(p.cloudId){
      ({ error } = await sb.from('purchases').update(row).eq('id', p.cloudId));
    } else {
      const res = await sb.from('purchases').insert(row).select('id').single();
      error = res.error;
      if(res.data?.id){
        p.cloudId = res.data.id;
        // حدّث النسخة المحلية بالـ cloudId
        const local = db.purchases.find(x => x.id === p.id);
        if(local) local.cloudId = res.data.id;
        save();
      }
    }
    if(error) console.warn('upsertPurchase', error.message);
  }catch(e){ console.warn(e); }
}

async function deletePurchaseCloud(pid){
  try{
    const sb = window.supabaseClient;
    if(!sb) return;
    const local = db.purchases.find(x => x.id === pid);
    const cloudId = local?.cloudId;
    if(!cloudId) return;
    const { error } = await sb.from('purchases').delete().eq('id', cloudId);
    if(error) console.warn('deletePurchase', error.message);
  }catch(e){ console.warn(e); }
}

    const {data,error}=await cloudCompanyFilter(sb.from('customers').select('*'));
    if(error||!Array.isArray(data)||!data.length) return false;

async function lookupVinNhtsa(vin){
  const out={};
  try{
    const res=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/'+encodeURIComponent(vin)+'?format=json');
    if(!res.ok) return out;
    const data=await res.json();
    const bag={};
    (data.Results||[]).forEach(x=>{ if(x.Variable) bag[x.Variable]=pickVinVal(x.Value); });
    out.make=bag.Make||bag.Manufacturer||'';
    out.model=bag.Model||bag.Series||bag.Trim||bag['Series2']||'';
    out.year=bag['Model Year']||'';
    out.engine=pickVinVal(bag['Engine Model']||bag['Engine Configuration']||'');
    if(bag.DisplacementL) out.engine=(out.engine?out.engine+' ':'')+bag.DisplacementL+'L';
    if(bag['Turbo']) out.engine=(out.engine+' '+bag['Turbo']).trim();
    out.fuel_type=bag['Fuel Type - Primary']||bag['Fuel Type - Alternate']||'';
    out.engine_power_kw=bag['Engine Power (KW)']||'';
    out.engine_displacement_cm3=bag['Displacement (CC)']||(bag['Displacement (L)']?Math.round(Number(bag['Displacement (L)'])*1000):'')||(bag.DisplacementL?Math.round(Number(bag.DisplacementL)*1000):'');
    out.body=bag['Body Class']||'';
    out.cylinders=bag['Engine Number of Cylinders']||'';
  }catch(e){}
  return out;
}
async function lookupVinEdge(vin){
  const out={};
  try{
    const res=await fetch('https://carchecktools.com/api/v1/decode-vin?vin='+encodeURIComponent(vin));
    if(!res.ok) return out;
    const j=await res.json();
    const d=j.data||j.result||j.vehicle||j;
    out.make=pickVinVal(d.make||d.Make);
    out.model=pickVinVal(d.model||d.Model);
    out.year=pickVinVal(d.year||d.modelYear||d.ModelYear);
    out.engine=pickVinVal(d.engine||d.engineModel||d.Engine);
    out.fuel_type=pickVinVal(d.fuel||d.fuelType||d.FuelType);
    out.engine_power_kw=pickVinVal(d.engineKW||d.kw||d.power_kw);
    const cc=d.displacementCC||d.displacement_cc||d.engine_displacement_cm3;
    const liters=d.displacementL||d.displacement_l;
    out.engine_displacement_cm3=pickVinVal(cc)||(liters?String(Math.round(Number(liters)*1000)):'');
    if(liters && !out.engine) out.engine=Number(liters).toFixed(1)+'L';
    out.body=pickVinVal(d.body||d.bodyClass);
  }catch(e){}
  return out;
}
async function sha1hex(s){
  const buf=await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

  const map={'1J':'Golf IV / Bora','1K':'Golf V / Jetta','5K':'Golf VI','5G':'Golf VII','CD':'Golf VIII','6R':'Polo','6C':'Polo','AW':'Polo','9N':'Polo','3C':'Passat B6/B7','3G':'Passat B8','7L':'Touareg','7P':'Touareg','5N':'Tiguan','AD':'Tiguan','5T':'Touran','1T':'Touran','7H':'T5','7E':'T5/T6','SH':'T6.1','8P':'A3 8P','8V':'A3 8V','8Y':'A3 8Y','8E':'A4 B6/B7','8K':'A4 B8','8W':'A4 B9','4B':'A6 C5','4F':'A6 C6','4G':'A6 C7','4K':'A6 C8','4L':'Q7','8U':'Q3','8R':'Q5','1Z':'Octavia II','5E':'Octavia III','NE':'Octavia IV','5J':'Fabia II','NJ':'Fabia III'};

async function lookupVinVincario(vin){
  const key=(db.settings.vincarioKey||'').trim();
  const secret=(db.settings.vincarioSecret||'').trim();
  if(!key||!secret) return {};
  try{
    const sum=(await sha1hex(vin+'|decode|'+key+'|'+secret)).slice(0,10);
    const url='https://api.vincario.com/3.2/'+encodeURIComponent(key)+'/'+sum+'/decode/'+vin+'.json';
    const res=await fetch(url);
    if(!res.ok) return {};
    const j=await res.json();
    const bag={};
    (j.decode||j.data||[]).forEach(x=>{
      const label=String(x.label||x.key||'').toLowerCase();
      const val=pickVinVal(x.value);
      if(label&&val) bag[label]=val;
    });
    const g=k=>bag[k]||'';
    return {
      make:g('make')||g('manufacturer'),
      model:g('model')||g('series'),
      year:g('model year')||g('year'),
      engine:g('engine code')||g('engine')||g('engine model'),
      fuel_type:g('fuel type')||g('fuel'),
      engine_power_kw:(g('engine power (kw)')||g('power kw')||g('engine power')).replace(/[^\d.]/g,''),

    };

async function lookupVin(vin){
  vin=cleanVin(vin);
  if(vin.length!==17) throw new Error('VIN لازم 17 خانة');
  const [vinc,a,b]=await Promise.all([lookupVinVincario(vin), lookupVinNhtsa(vin), lookupVinEdge(vin)]);
  const merge=(k)=>pickVinVal(vinc[k])||pickVinVal(a[k])||pickVinVal(b[k])||'';
  let make=merge('make')||vinMakeFromWmi(vin);
  let model=merge('model')||vagModelFromVin(vin);
  let year=merge('year')||vinModelYear(vin);
  let engine=merge('engine');
  let cc=merge('engine_displacement_cm3');
  if(!engine && cc) engine=(Number(cc)/1000).toFixed(1)+'L'+(merge('cylinders')?(' '+merge('cylinders')+'Zyl.'):'');
  if(!cc && engine && /(\d(?:\.\d)?)\s*L/i.test(engine)) cc=String(Math.round(parseFloat(RegExp.$1)*1000));
  const info={
    vin, make, model, year, engine,
    fuel_type: merge('fuel_type'),
    engine_power_kw: merge('engine_power_kw'),
    engine_displacement_cm3: cc,
    body: merge('body'),
    paint: merge('paint')
  };
  if(!make && !model && !year) throw new Error('ما انلقطت بيانات لهالـ VIN');
  return info;
}
function fillVinFields(info, ids){

  if(ids.vin){ const el=$(ids.vin); if(el) el.value=info.vin; }
  set(ids.make, info.make);
  set(ids.model, info.model);
  set(ids.year, info.year);
  if(ids.cc) set(ids.cc, info.engine_displacement_cm3);
  if(ids.fuel) set(ids.fuel, info.fuel_type);
  if(ids.kw) set(ids.kw, info.engine_power_kw);
  if(ids.en) set(ids.en, info.engine);
  if(ids.pa && info.paint) set(ids.pa, info.paint);
}

function parseHsnTsnHtml(html, hsn, tsn){
  const key=(hsn+'/'+tsn).toUpperCase();
  const text=String(html||'').replace(/\s+/g,' ');
  const re=new RegExp(key.replace('/','\\/')+'[\\s\\S]{0,280}','i');
  const chunk=(text.match(re)||[text])[0];
  const model=(chunk.match(/>([A-Z][^<]{8,80})</)||chunk.match(/([A-Za-z][A-Za-z0-9 .\/+-]{6,80}\d\.\d[^<]{0,40})/)||[])[1]||'';
  const kw=(chunk.match(/(\d+)\s*kW/i)||[])[1]||'';
  const cc=(chunk.match(/(\d{3,5})\s*ccm/i)||[])[1]||'';
  const fuel=(/Diesel/i.test(chunk)?'Diesel':(/Benzin|Otto/i.test(chunk)?'Benzin':(/Elektro/i.test(chunk)?'Elektro':(/Hybrid/i.test(chunk)?'Hybrid':''))));
  const clean=String(model).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  return {model:clean, engine_power_kw:kw, engine_displacement_cm3:cc, fuel_type:fuel};

function parseFahrzeugdaten(html, fallbackMake){
  const title=(String(html).match(/<title>([^<]+)/i)||html.match(/^Title[:\s]+(.+)$/mi)||[])[1]||'';
  const clean=title.replace(/\s*\|\s*HSN.*$/i,'').replace(/\s+/g,' ').trim();
  const parts=clean.split(/\s+/);
  let make=fallbackMake, model=clean;
  if(parts.length>=2){ make=parts[0]; model=parts.slice(1).join(' '); }
  const kw=(html.match(/(\d+)\s*k\s*w/i)||html.match(/Leistung[^0-9]{0,40}(\d+)/i)||[])[1]||'';
  const cc=(html.match(/Hubraum[^0-9]{0,80}(\d{3,5})/i)||html.match(/(\d{3,5})\s*ccm/i)||[])[1]||'';
  const year=(html.match(/(20\d{2})\s*[–-]\s*(20\d{2}|heute)/i)||html.match(/ab\s+(20\d{2})/i)||[])[1]||'';
  const fuel=/Diesel/i.test(html)?'Diesel':(/Elektro/i.test(html)?'Elektro':(/Hybrid/i.test(html)?'Hybrid':(/Benzin|Otto/i.test(html)?'Benzin':'')));
  return {make, model:String(model).replace(/,/g,' ').replace(/\s+/g,' ').trim(), engine_power_kw:kw, engine_displacement_cm3:cc, year, fuel_type:fuel};
}
function mapKbaFuel(code){
  const m={'1':'Benzin','2':'Diesel','3':'LPG','4':'Elektro','5':'Hybrid','6':'Wasserstoff','7':'Erdgas/CNG','8':'Ethanol','9':'Andere'};
  const c=String(code||'').trim();
  return m[c]||c;
}
async function lookupEasyWerkstatt(hsn,tsn){
  const urls=[
    'https://api.easywerkstatt.com/app/hsnTsn/'+hsn+'/'+tsn,
    'https://api.staging.easywerkstatt.com/app/hsnTsn/'+hsn+'/'+tsn
  ];
  for(const url of urls){
    try{
      const res=await fetch(url);
      if(!res.ok) continue;
      const j=await res.json();
      if(!j || (!j.brand && !j.modelName && !j.kbaBrand)) continue;
      const model=String(j.modelName||'').replace(/,/g,' ').replace(/\s+/g,' ').trim();
      const year=(j.tsnDate||'').slice(0,4);
      return {
        hsn:j.hsn||hsn, tsn:j.tsn||tsn, kba:(hsn+' '+tsn),
        make:j.brand||j.kbaBrand||'',
        model,
        year,
        engine_power_kw:j.powerKw||'',
        engine_displacement_cm3:j.ccm||'',
        fuel_type:mapKbaFuel(j.fuelCode),
        vehicleClass:j.vehicleClass||'',
        maxWeight:j.maxWeight||'',
        seats:j.seats||'',
        source:'easyWerkstatt'
      };
    }catch(e){}
  }
  return null;
}
async function lookupKbaFree(hsn,tsn){
  hsn=String(hsn||'').replace(/\D/g,'').padStart(4,'0');
  tsn=String(tsn||'').trim().toUpperCase();
  const local=lookupKbaLocal(hsn,tsn);
  const ew=await lookupEasyWerkstatt(hsn,tsn);
  if(ew && (ew.model||ew.engine_power_kw||ew.make)) return Object.assign({},local,ew);
  return local;
}
function bindKbaEnter(hsnId,tsnId,fillIds){
  const run=async()=>{
    const hsn=$(hsnId)?.value.trim();
    const tsn=$(tsnId)?.value.trim();
    if(!hsn||hsn.length<4||!tsn) return toast('أدخل HSN (4) وTSN (3)');
    toast('جاري جلب بيانات السيارة من المواقع المجانية...');
    const info=await lookupKbaFree(hsn,tsn);
    const set=(id,val)=>{ const el=$(id); if(el && val) el.value=val; };
    set(fillIds.make, info.make);
    set(fillIds.model, info.model);
    set(fillIds.year, info.year);
    set(fillIds.kw, info.engine_power_kw);
    set(fillIds.cc, info.engine_displacement_cm3);
    set(fillIds.fuel, info.fuel_type);
    set(fillIds.seats, info.seats);
    set(fillIds.weight, info.maxWeight);
    set(fillIds.klass, info.vehicleClass);
    if(info.model || info.engine_power_kw) toast((info.make||'')+' '+(info.model||'')+(info.engine_displacement_cm3?(' · '+info.engine_displacement_cm3+' cm³'):'')+(info.engine_power_kw?(' · '+info.engine_power_kw+' kW'):''));
    else toast((info.make||'KBA')+' — الموديل مو موجود بهالمصدر المجاني، كمّل يدوياً');
  };
  const hEl=$(hsnId), tEl=$(tsnId);
  if(hEl){
    hEl.addEventListener('input',()=>{
      hEl.value=hEl.value.replace(/\D/g,'').slice(0,4);
      if(hEl.value.length===4 && tEl) tEl.focus();
    });
    hEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(hEl.value.length===4 && tEl) tEl.focus(); }});
  }
  if(tEl){
    tEl.addEventListener('input',()=>{
      tEl.value=tEl.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,3);
      if(tEl.value.length===3) run();
    });
    tEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); run(); }});
  }
}

async function uploadWorkshopFile(file, folder){

  if(!sb || !file) return '';
  const name=(folder||'media')+'/'+Date.now()+'-'+(file.name||'img.jpg').replace(/[^a-zA-Z0-9._-]/g,'_');
  for(const bucket of ['workshop-media','purchase-receipts']){
    try{
      const {error}=await sb.storage.from(bucket).upload(name, file, {contentType:file.type||'image/jpeg', upsert:false});

function convertRepairToInvoice(rid){
  const r=db.repairs.find(x=>x.id===rid);

  const parts=repairPartsTotal(r);
  const labor=repairLaborTotal(r);
  const discount=0, tax=19;
  const net=Math.max(0,parts+labor-discount);
  const total=net*(1+tax/100);
  const inv={
    id:id('i'), companyId:session.company.id, vehicleId:r.vehicleId, repairId:r.id,
    number:nextInvoiceNumber(), type:'فاتورة',
    parts, labor, discount, tax, net, total, payment:'غير محدد', paid:false,
    date:new Date().toISOString(),
    lines:[
      ...(r.parts||[]).map(p=>({name:p.name, sku:p.sku, qty:p.qty, price:p.price, kind:'parts'})),
      {name:'Arbeitswert', qty:Number(r.hours||1), price:Number(workshop().hourlyRate||db.settings.hourlyRate||100), kind:'labor'}
    ], auftrag:r.number||nextAuftragNumber()
  };

const PAGE_SIZE = 50;
function table(headers, rows, pageKey){
  if(!rows.length) return `<div class="card muted">لا توجد بيانات بعد.</div>`;
  const key = pageKey || 'default';
  if(!window._tblPage) window._tblPage = {};
  if(window._tblPage[key] == null) window._tblPage[key] = 0;
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(window._tblPage[key] >= pages) window._tblPage[key] = pages - 1;
  const page = window._tblPage[key];
  const slice = rows.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
  const pager = pages > 1 ? `<div class="toolbar" style="margin-top:10px;justify-content:space-between">
    <span class="muted">عرض ${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,total)} من ${total}</span>
    <div class="toolbar">
      <button class="btn small ghost" ${page<=0?'disabled':''} onclick="window._tblPage['${key}']=${page-1};render()">${t('prev')}</button>
      <span class="muted">${page+1} / ${pages}</span>
      <button class="btn small ghost" ${page>=pages-1?'disabled':''} onclick="window._tblPage['${key}']=${page+1};render()">${t('next')}</button>
    </div>
  </div>` : `<div class="muted" style="margin-top:8px">${total} سجل</div>`;
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
  <tbody>${slice.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${pager}`;
}

function getPrintFrame(){
  let f=document.getElementById('printFrame');
  if(!f){
    f=document.createElement('iframe');
    f.id='printFrame';
    f.setAttribute('aria-hidden','true');
    f.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none';
    document.body.appendChild(f);
  }
  return f;
}
function exportPrint(type, id){
  const page=printDocMarkup(type,id);
  const iframe=getPrintFrame();
  const doc=iframe.contentDocument;
  doc.open(); doc.write(page); doc.close();
  const run=()=>{ try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ toast('تعذر فتح الطابعة'); } };
  requestAnimationFrame(()=>requestAnimationFrame(run));
}

function exportPDF(type, id){
  if(type==='invoices' && id) return exportInvoicePDF(id);
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const text = plainTextDoc(type, id);
    const lines = doc.splitTextToSize(text, 180);
    let y = 15;
    doc.setFontSize(11);
    lines.forEach(line => {
      if(y > 280){ doc.addPage(); y = 15; }
      doc.text(line, 15, y);
      y += 6;
    });
    const name = `${type || 'report'}-${(id||'list').slice(0,12)}-${Date.now().toString(36)}.pdf`;
    doc.save(name);
    toast('تم إنشاء PDF');
  }catch(e){
    console.error(e);
    toast('تعذر إنشاء PDF');
  }
}
async function exportInvoicePDF(iid){
  const inv=(db.invoices||[]).find(x=>x.id===iid);
  if(!inv) return toast(t('invMissing'));
  if(!window.html2canvas || !window.jspdf) return toast('مكتبة PDF غير محمّلة — حدّث الصفحة');
  toast('جاري تجهيز PDF...');
  const page=printDocMarkup('invoices', iid);
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';
  const fr=document.createElement('iframe');
  fr.style.cssText='width:794px;height:1123px;border:0;background:#fff';
  host.appendChild(fr);
  document.body.appendChild(host);
  const doc=fr.contentDocument;
  doc.open(); doc.write(page); doc.close();
  await new Promise(r=>setTimeout(r,180));
  try{
    const canvas=await window.html2canvas(doc.body,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:794,windowHeight:Math.max(doc.body.scrollHeight,1123)});
    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const img=canvas.toDataURL('image/jpeg',0.92);
    const pageW=210, pageH=297;
    const imgH=pageW*canvas.height/canvas.width;
    let left=imgH;
    pdf.addImage(img,'JPEG',0,0,pageW,imgH,'inv','FAST');
    let offset=pageH;
    while(left>pageH+1){
      pdf.addPage();
      pdf.addImage(img,'JPEG',0, -(offset), pageW, imgH,'inv','FAST');
      left-=pageH; offset+=pageH;
    }
    const name=(inv.number||'Rechnung').replace(/[^\w.-]+/g,'_')+'.pdf';
    pdf.save(name);
    toast('تم حفظ PDF');
  }catch(e){
    console.error(e);
    toast('تعذر إنشاء PDF');
  }
  host.remove();
}
window.exportInvoicePDF=exportInvoicePDF;

function compressVehiclePhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=900;
      let w=img.width,h=img.height;
      if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      const c=document.createElement('canvas'); c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=reject;
    img.src=url;
  });
}

function fieldAfter(text, keys){
  for(const k of keys){
    const re=new RegExp(k+'\\s*[:.]?\\s*([^\\n]{2,80})','i');
    const m=text.match(re);
    if(m) return m[1].replace(/\s{2,}/g,' ').trim();
  }
  return '';
}
function parseVehicleOCR(text){
  const raw=String(text||'').replace(/\r/g,'\n');
  const t=raw.replace(/[ \t]+/g,' ').replace(/\n+/g,'\n');
  const upper=t.toUpperCase();
  const vinMatch=upper.match(/\b[A-HJ-NPR-Z0-9]{17}\b/);
  const plateMatch=upper.match(/\b([A-ZÄÖÜ]{1,3})[-\s]?([A-Z]{1,2})[-\s]?(\d{1,4}[EH]?)\b/);
  const plate=plateMatch ? (plateMatch[1]+'-'+plateMatch[2]+' '+plateMatch[3]) : '';
  const d1=fieldAfter(t,['D\\.1','Marke','Hersteller']);
  const d3=fieldAfter(t,['D\\.3','Handelsbezeichnung']);
  const makes=['VOLKSWAGEN','VW','BMW','MERCEDES-BENZ','MERCEDES','AUDI','OPEL','FORD','TOYOTA','RENAULT','PEUGEOT','CITROEN','SKODA','SEAT','FIAT','HYUNDAI','KIA','PORSCHE','MAZDA','NISSAN','HONDA','VOLVO','DACIA','TESLA','MINI','SMART','JEEP','SUZUKI','CUPRA'];
  const makeFromList=makes.find(x=>upper.includes(x))||'';
  const make=(d1.match(new RegExp(makes.join('|'),'i'))||[makeFromList])[0] || d1.split(/[/,]/)[0].trim();
  const model=(d3||'').replace(new RegExp('^'+String(make||'')+'\\s*','i'),'').trim();
  const yearMatch=t.match(/B\s*[:.]?\s*(\d{2}\.\d{2}\.(19|20)\d{2})/i) || t.match(/\b(\d{2}\.\d{2}\.(19|20)\d{2})\b/);
  const firstRegistration=yearMatch ? (yearMatch[1]||yearMatch[0]) : '';
  const year=firstRegistration.slice(-4);
  const owner=fieldAfter(t,['C\\.1\\.1','Halter','Name oder Firmenname']);
  const address=fieldAfter(t,['C\\.1\\.3','Anschrift']);
  const engine=fieldAfter(t,['P\\.1','Hubraum']);
  const kw=fieldAfter(t,['P\\.2','Nennleistung']);
  const fuel=fieldAfter(t,['P\\.3','Kraftstoff']);
  const paint=fieldAfter(t,['Farbe des Fahrzeugs']);
  return {
    vin: vinMatch? vinMatch[0] : '',
    plate,
    make: String(make||'').trim(),
    model: String(model||'').trim().slice(0,40),
    year,
    firstRegistration,
    owner_name: String(owner||'').replace(/C\.1\.\d/g,'').trim(),
    address,
    engine_displacement_cm3: (engine.match(/\d{3,5}/)||[''])[0],
    engine_power_kw: (kw.match(/\d{2,3}/)||[''])[0],
    fuel_type: fuel,
    paint,
    engine: ''
  };
}
function preprocessSchein(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1800;
      let w=img.width,h=img.height;
      if(Math.max(w,h)>max){const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s);}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const data=ctx.getImageData(0,0,w,h);
      const d=data.data;
      for(let i=0;i<d.length;i+=4){
        let g=d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11;
        g=(g-128)*1.35+128;
        g=g<40?0:g>220?255:g;
        d[i]=d[i+1]=d[i+2]=g;
      }
      ctx.putImageData(data,0,0);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.88));
    };
    img.onerror=reject;
    img.src=url;
  });
}
function mergeSchein(ai, local){
  const pick=(a,b,ok)=>{
    const x=(a||'').toString().trim();
    const y=(b||'').toString().trim();
    if(ok){ if(ok(x)) return x; if(ok(y)) return y; }
    return x||y||'';
  };
  ai=ai||{}; local=local||{};
  return {
    license_plate: pick(ai.license_plate||ai.plate, local.plate, v=>/[A-ZÄÖÜ]{1,3}-?[A-Z]{1,2}\s?\d{1,4}/i.test(v)),
    vin: pick(ai.vin, local.vin, v=>/^[A-HJ-NPR-Z0-9]{17}$/i.test(v)),
    brand: pick(ai.brand||ai.make, local.make),
    model: pick(ai.model, local.model),
    year: pick(ai.year, local.year, v=>/^(19|20)\d{2}$/.test(v)),
    owner_name: pick(ai.owner_name||ai.holder||ai.customer_name, local.owner_name),
    address: pick(ai.address||ai.owner_address, local.address),
    engine_displacement_cm3: pick(ai.engine_displacement_cm3, local.engine_displacement_cm3),
    engine_power_kw: pick(ai.engine_power_kw, local.engine_power_kw),
    fuel_type: pick(ai.fuel_type, local.fuel_type),
    engine_code: pick(ai.engine_code||ai.engine, local.engine),
    color: pick(ai.color||ai.paint, local.paint),
    first_registration: pick(ai.first_registration, local.firstRegistration)
  };
}
async function readScheinAI(file){
  const imageData = await preprocessSchein(file);
  let ai={};
  try{
    const response = await fetch(`${window.SUPABASE_URL}/functions/v1/vehicle-ocr`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': window.SUPABASE_KEY,
        'Authorization': `Bearer ${window.SUPABASE_KEY}`
      },
      body: JSON.stringify({
        image: imageData,
        country: 'DE',
        document: 'Zulassungsbescheinigung Teil I',
        fields: ['A Kennzeichen','B Erstzulassung','C.1.1 Halter','C.1.3 Anschrift','D.1 Marke','D.3 Handelsbezeichnung','E VIN','P.1 Hubraum','P.2 kW','P.3 Kraftstoff','R Farbe']
      })
    });
    const js = await response.json();
    if (response.ok) ai = js; else console.warn(js);
  }catch(e){ console.warn('vehicle-ocr', e); }
  let local={};
  try{
    if(window.Tesseract){
      const res=await Tesseract.recognize(imageData,'deu');
      local=parseVehicleOCR(res&&res.data&&res.data.text||'');
    }
  }catch(e){ console.warn('tesseract', e); }
  const merged=mergeSchein(ai, local);
  if(!merged.vin && !merged.license_plate) throw new Error('تعذرت قراءة ورقة السيارة');
  return merged;
}
function findOrCreateFromSchein(ai){
  const plate = (ai.license_plate || ai.plate || '').trim();
  const vin = (ai.vin || '').trim().toUpperCase();
  let v = db.vehicles.find(x => (vin && (x.vin||'').toUpperCase()===vin) || (plate && x.plate===plate));
  const ownerName = (ai.owner_name || ai.holder || ai.customer_name || '').trim() || (plate ? ('مالك '+plate) : 'زبون جديد');
  const ownerPhone = (ai.phone || ai.owner_phone || '').trim();
  const ownerAddr = (ai.address || ai.owner_address || '').trim();
  let c = v ? db.customers.find(x=>x.id===v.customerId) : db.customers.find(x=>x.companyId===session.company.id && x.name===ownerName);
  if(!c){
    c={id:id('c'),companyId:session.company.id,name:ownerName,phone:ownerPhone,email:'',address:ownerAddr};
    db.customers.push(c); upsertCustomerCloud(c);
  }
  if(!v){
    v={id:id('v'),companyId:session.company.id,customerId:c.id,cloudId:undefined,
      plate, vin, make:ai.brand||ai.make||'', model:ai.model||'', year:ai.year||'',
      engine:ai.engine_code||ai.engine||'', paint:ai.color||ai.paint||'',
      engine_displacement_cm3:ai.engine_displacement_cm3||'', fuel_type:ai.fuel_type||'',
      engine_power_kw:ai.engine_power_kw||'', km:0, nextServiceKm:0, photo:'',
      ocrSource:'fahrzeugschein'};
    db.vehicles.push(v); upsertVehicleCloud(v);
  } else if(c && v.customerId!==c.id && !v.customerId){
    v.customerId=c.id;
  }
  return {c,v};
}

function deMoney(n){
  return Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function nextKdNr(){
  const nums=(db.customers||[]).map(c=>parseInt(String(c.kdNr||c.number||'').replace(/\D/g,''),10)).filter(n=>n>0);
  const n=(nums.length?Math.max(...nums):1000)+1;
  return String(n).padStart(4,'0');
}
function ensureKd(cust){
  if(!cust || !cust.id) return cust||{};
  if(!cust.kdNr && !cust.number){
    cust.kdNr=nextKdNr();
    const i=db.customers.findIndex(x=>x.id===cust.id);
    if(i>=0){ db.customers[i].kdNr=cust.kdNr; save(); }
  }
  return cust;
}
function deDate(d){
  try{ return new Date(d||Date.now()).toLocaleDateString('de-DE'); }catch(e){ return d||''; }
}
function lineSum(ln){ return Number(ln.qty||1)*Number(ln.price||0); }
function isLaborLine(ln){ if(ln.kind==='parts'||ln.kind==='قطعة'||ln.kind==='Ersatzteil') return false; if(ln.kind==='labor'||ln.kind==='اجر'||ln.kind==='أجور') return true; return /lohn|أجر|اجور|أجور|عمالة|arbeit|Arbeitswert|Leist/i.test(String(ln.name||ln.sku||ln.kind||'')); }
function invoiceModel(x){
  const w=workshopInfo();
  const cust=customerOfVehicle(x.vehicleId) || db.customers.find(c=>c.id===x.customerId) || {};
  const veh=vehicleOf(x.vehicleId) || {};
  const lines=(x.lines&&x.lines.length)?x.lines:[{sku:'',name:'Arbeitswert',qty:1,price:x.labor||0,tax:19}].filter(l=>lineSum(l)||l.name);
  const filled=lines.map((ln,i)=>{
    const labor=isLaborLine(ln);
    return {
      pos:i+1, sku:ln.sku||ln.number||'', name:ln.name||'',
      kind: labor?'Arbeitsleistung':'Ersatzteil',
      qty:Number(ln.qty||1), price:Number(ln.price||0),
      tax:Number(ln.tax||x.tax||19), sum:Math.round(lineSum(ln)*100)/100
    };
  });
  const teile=Math.round(filled.filter(l=>l.kind!=='Arbeitsleistung').reduce((s,l)=>s+l.sum,0)*100)/100;
  const leist=Math.round(filled.filter(l=>l.kind==='Arbeitsleistung').reduce((s,l)=>s+l.sum,0)*100)/100;
  const net=Math.round((teile+leist-Number(x.discount||0))*100)/100;
  const rate=Number(x.tax||19)/100;
  const vat=Math.round(net*rate*100)/100;
  const total=Math.round((net+vat)*100)/100;
  ensureKd(cust);
  const kd=cust.kdNr||cust.number||'';
  const beleg=String(x.number||'').replace(/^RE-\d+-/,'') || x.number || '';
  const repair=(db.repairs||[]).find(r=>r.id===x.repairId) || (db.repairs||[]).filter(r=>r.vehicleId===x.vehicleId).slice(-1)[0];
  const auftrag=x.auftrag || (repair&&repair.number) || '';
  const due=new Date(x.date||Date.now());
  due.setDate(due.getDate()+Number(w.paymentDays||0));
  return {w,cust,veh,filled,teile,leist,net,vat,total,kd,beleg,leistDate:deDate(x.date),dueDate:deDate(due),auftrag,repair,x};
}

function importHenryArticles(text){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return 0;
  const sep=lines[0].includes(';')?';':(lines[0].includes('\t')?'\t':',');
  let n=0;
  lines.forEach((line,idx)=>{
    const c=line.split(sep).map(x=>x.replace(/^"|"$/g,'').trim());
    if(!c.length) return;
    if(idx===0 && /artikel|nr|bezeich|name|sku/i.test(line) && !/\d{4,}/.test(c[0])) return;
    const sku=c[0];
    if(!sku) return;
    const name=c[1]||sku;
    let price=0;
    for(const x of c.slice(2)){
      const v=Number(String(x).replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''));
      if(v>0){ price=v; break; }
    }
    rememberKatyArticle({sku,name,price});
    let inv=(db.inventory||[]).find(x=>String(x.sku||'').toUpperCase()===sku.toUpperCase());
    if(!inv){
      inv={id:id('n'),companyId:session.company.id,sku,name,qty:0,buy:price,sell:price,minQty:3};
      db.inventory.push(inv);
    } else {
      if(price) inv.sell=price;
      if(name) inv.name=name;
    }
    n++;
  });
  save();
  return n;
}
function lookupKatyArticle(sku){
  sku=String(sku||'').trim();
  if(!sku) return null;
  const up=sku.toUpperCase();
  const inv=(db.inventory||[]).find(x=>String(x.sku||'').toUpperCase()===up || String(x.name||'').toUpperCase()===up);
  if(inv) return {sku:inv.sku||sku,name:inv.name,qty:1,price:Number(inv.sell||inv.buy||0),source:'مخزون'};
  const cache=(db.katyCache||[]).find(x=>String(x.sku||'').toUpperCase()===up);
  if(cache) return {sku:cache.sku,name:cache.name,qty:1,price:Number(cache.price||0),source:'Katy'};
  const fromInv=(db.invoices||[]).flatMap(i=>i.lines||[]).find(l=>String(l.sku||'').toUpperCase()===up);
  if(fromInv) return {sku:fromInv.sku,name:fromInv.name,qty:1,price:Number(fromInv.price||0),source:'فاتورة سابقة'};
  return null;
}
function rememberKatyArticle(art){
  if(!art||!art.sku) return;
  db.katyCache=db.katyCache||[];
  const i=db.katyCache.findIndex(x=>String(x.sku).toUpperCase()===String(art.sku).toUpperCase());
  const row={sku:art.sku,name:art.name,price:Number(art.price||0),ts:Date.now()};
  if(i>=0) db.katyCache[i]=row; else db.katyCache.unshift(row);
  db.katyCache=db.katyCache.slice(0,400);
  save();
}
function openKatySearch(sku){
  const base=(db.settings.katyUrl||'https://www.matthies.de/software/katy.html').trim();
  const q=encodeURIComponent(sku||'');
  window.open(q? (base + (base.includes('?')?'&':'?') + 'q='+q) : base, '_blank');
}
function parseInvoiceLine(l){
  const parts=l.split('|').map(x=>x.trim());
  if(parts.length>=4) return {sku:parts[0],name:parts[1],qty:Number(parts[2]||1),price:Number(parts[3]||0)};
  if(parts.length===3){
    const hit=lookupKatyArticle(parts[0]);
    if(hit && !isNaN(parts[1]) && !isNaN(parts[2])) return {sku:parts[0],name:hit.name,qty:Number(parts[1]),price:Number(parts[2])};
    return {sku:'',name:parts[0],qty:Number(parts[1]||1),price:Number(parts[2]||0)};
  }
  if(parts.length===1){
    const hit=lookupKatyArticle(parts[0]);
    if(hit) return hit;
    return {sku:parts[0],name:parts[0],qty:1,price:0};
  }
  return {sku:'',name:parts[0]||'Position',qty:Number(parts[1]||1),price:Number(parts[2]||0)};
}

function collectInvoiceRows(){
  return [...document.querySelectorAll('#invRows tr')].map(tr=>{

  let inv = db.inventory.find(x => x.companyId === (p.companyId||session?.company?.id) && (x.name === name || x.sku === name));
  if(inv){
    inv.qty = Number(inv.qty||0) + qty;
    if(price > 0) inv.buy = price;
    save();
    upsertInventoryCloud(inv);
  } else {
    const item = {
      id: id('inv'),
      companyId: p.companyId || session?.company?.id || 'de',
      sku: (p.invoice_number || 'AUTO') + '-' + Date.now().toString(36).slice(-4),
      name,
      qty,
      buy: price,
      sell: price ? Math.round(price * 1.6 * 100) / 100 : 0
    };
    db.inventory.push(item);
    save();
    upsertInventoryCloud(item);
  }
}

/** تصغير وضغط الصورة قبل OCR — أسرع وأقل حجماً */
function compressImageForOCR(file, maxSide=1280, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith('image/')){
      // PDF أو غير صورة: أرجعه كما هو
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        let { width, height } = img;
        const scale = Math.min(1, maxSide / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        // JPEG دائماً للـ OCR
        resolve(canvas.toDataURL('image/jpeg', quality));
      }catch(e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

    const saveBtn = $('#msave');

    const fileInput = $('#purchaseFile');
    const btnRead = $('#btnRead');
    const btnPreview = $('#btnPreview');
    const btnCam = $('#btnOpenCam');
    const img = $('#purchaseImg');
    const status = $('#purchaseStatus');
    const formBox = $('#purchaseFormBox');

    function setPreviewFromFile(f){
      pendingFile = f;
      if(pendingPreviewUrl) URL.revokeObjectURL(pendingPreviewUrl);
      pendingPreviewUrl = null;
      pendingAi = {};
      pendingReceiptUrl = '';
      formBox.classList.add('hidden');
      if(saveBtn) saveBtn.disabled = true;

      if(f.type.startsWith('image/')){
        pendingPreviewUrl = URL.createObjectURL(f);
        img.src = pendingPreviewUrl;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }
      btnRead.disabled = false;
      btnPreview.disabled = false;
      status.textContent = 'جاهز — اضغط «قراءة البيانات» أو «عرض الفاتورة»';
    }

    fileInput.onchange = ()=>{
      const f = fileInput.files[0];
      if(f) setPreviewFromFile(f);
    };

    // عرض كامل قبل الحفظ
    function openFullPreview(){
      if(pendingPreviewUrl){
        window.open(pendingPreviewUrl, '_blank');
        return;
      }
      if(pendingFile){
        const url = URL.createObjectURL(pendingFile);
        window.open(url, '_blank');
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
        return;
      }
      toast('لا توجد صورة للعرض');
    }
    btnPreview.onclick = openFullPreview;
    img.onclick = openFullPreview;

    btnCam.onclick = ()=> openCameraForPurchase((file)=>{
      // وضع الملف في الـ input
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      setPreviewFromFile(file);
    });

    // قراءة سريعة: OCR فقط بدون رفع
    btnRead.onclick = async ()=>{
      const f = pendingFile || fileInput.files[0];
      if(!f) return toast(t('pickPhoto'));

      btnRead.disabled = true;
      status.textContent = '⚡ جاري قراءة البيانات...';
      const t0 = performance.now();

      try{
        // تصغير وضغط الصورة أولاً → أسرع في الإرسال والقراءة
        status.textContent = '⚡ جاري تجهيز الصورة...';
        const imageData = await compressImageForOCR(f, 1280, 0.72);
        const approxKB = Math.round((imageData.length * 0.75) / 1024);
        status.textContent = `⚡ جاري قراءة البيانات (~${approxKB}KB)...`;

        let ai = {};
        try{
          const controller = new AbortController();
          const timeout = setTimeout(()=> controller.abort(), 15000); // أقصى 15 ثانية

          const response = await fetch(`${window.SUPABASE_URL}/functions/v1/purchase-ocr`, {
            method: 'POST',
            signal: controller.signal,
            headers: {
              'Content-Type': 'application/json',
              'apikey': window.SUPABASE_KEY,
              'Authorization': `Bearer ${window.SUPABASE_KEY}`
            },
            body: JSON.stringify({ image: imageData })
          });
          clearTimeout(timeout);

          if(response.ok){
            ai = await response.json();
          } else {
            console.warn('OCR failed', await response.text());
          }
        } catch(ocrErr){
          console.warn('OCR error/timeout', ocrErr);
        }

        pendingAi = ai || {};
        const parseNum = (v) => Number(String(v||'0').replace(',','.').replace(/[^\d.-]/g,'')) || 0;

        // املأ النموذج فوراً
        $('#p_supplier').value = ai.supplier_name || ai.supplier || '';
        $('#p_inv').value = ai.invoice_number || '';
        $('#p_date').value = (ai.purchase_date || ai.date || new Date().toISOString().slice(0,10)).toString().slice(0,10);
        $('#p_sub').value = parseNum(ai.subtotal);
        $('#p_tax').value = parseNum(ai.tax_amount);
        const total = parseNum(ai.total_amount) || (parseNum(ai.subtotal) + parseNum(ai.tax_amount));
        $('#p_total').value = total;
        $('#p_notes').value = ai.notes || ai.item || '';
        if(ai.payment_status) $('#p_status').value = ai.payment_status;

        formBox.classList.remove('hidden');
        if(saveBtn) saveBtn.disabled = false;

        const ms = Math.round(performance.now() - t0);
        const hasData = !!(ai.supplier_name || ai.supplier || ai.invoice_number || total);
        status.textContent = hasData
          ? `✓ تمت القراءة خلال ${ms}ms — راجع البيانات ثم احفظ`
          : `⚠ لم تُستخرج بيانات كافية (${ms}ms) — أكمل يدوياً ثم احفظ`;

      } catch(e){
        console.error(e);
        status.textContent = 'خطأ في القراءة: ' + (e.message||'');
        // افتح النموذج يدوياً حتى لو فشل OCR
        formBox.classList.remove('hidden');
        if(saveBtn) saveBtn.disabled = false;
        $('#p_date').value = new Date().toISOString().slice(0,10);
      } finally {
        btnRead.disabled = false;
      }
    };
  }, 30);
}

async function openCameraForPurchase(onCapture){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return toast('الكاميرا غير مدعومة في هذا المتصفح');
  }

  const box = document.createElement('div');
  box.className = 'modal-back';
  box.innerHTML = `
    <div class="modal" style="max-width:700px">
      <div class="modal-head">
        <b>📷 تصوير فاتورة الشراء</b>
        <button id="camClose" class="btn bad">✕</button>
      </div>
      <video id="cameraVideo" autoplay playsinline style="width:100%;border-radius:12px;background:#000;max-height:60vh"></video>
      <div style="margin-top:12px;text-align:center;display:flex;gap:8px;justify-content:center">
        <button id="takePhoto" class="btn primary">📸 التقاط</button>
        <button id="camClose2" class="btn ghost">إلغاء</button>
      </div>
    </div>
  `;
  document.body.appendChild(box);

  const video = box.querySelector('#cameraVideo');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = stream;

    const close = ()=>{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      box.remove();
    };
    box.querySelector('#camClose').onclick = close;
    box.querySelector('#camClose2').onclick = close;

    box.querySelector('#takePhoto').onclick = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(blob=>{
        if(!blob){ toast('فشل التقاط الصورة'); return; }
        const file = new File([blob], 'purchase-receipt.jpg', { type: 'image/jpeg' });
        close();
        if(typeof onCapture === 'function') onCapture(file);
        else toast('تم التقاط الصورة');
      }, 'image/jpeg', 0.85); // جودة 0.85 = أسرع وأصغر
    };
  } catch(e){
    box.remove();
    toast('لم يتم السماح باستخدام الكاميرا');
    console.error(e);
  }
}

<button id="takePhoto" class="btn primary">📸 التقاط الصورة</button>
</div>
</div>
`;

document.body.appendChild(box);

const video=box.querySelector('#cameraVideo');
let stream;

try{
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:'environment'}},
audio:false
});

video.srcObject=stream;

const close=()=>{
if(stream) stream.getTracks().forEach(t=>t.stop());
box.remove();
};

box.querySelector('#camClose').onclick=close;

box.querySelector('#takePhoto').onclick=()=>{
const canvas=document.createElement('canvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext('2d').drawImage(video,0,0);

canvas.toBlob(blob=>{
const file=new File([blob],'fahrzeugschein.jpg',{type:'image/jpeg'});
const dt=new DataTransfer();
dt.items.add(file);

const input=document.querySelector('#doc');
input.files=dt.files;
input.dispatchEvent(new Event('change',{bubbles:true}));

close();
toast('تم التقاط الصورة بنجاح');
},'image/jpeg',0.92);
};

}catch(e){
box.remove();
toast('لم يتم السماح باستخدام الكاميرا');
console.error(e);
}
}
 
</script>
</body>
</html>
