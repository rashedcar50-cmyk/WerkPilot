<script>
(function(){
  var CUR='1.12.74';
  var m=location.search.match(/[?&]v=([^&]*)/);
  if(!m || m[1]!==CUR){
    location.replace(location.pathname + '?v=' + CUR + location.hash);
  }
  try{
    var k=localStorage.getItem('werkivo_openai_v1')||localStorage.getItem('werkivo_openai')||'';
    if(k){ localStorage.setItem('werkivo_openai_v1',k); localStorage.setItem('werkivo_openai',k); }
  }catch(e){}
})();
</script>
